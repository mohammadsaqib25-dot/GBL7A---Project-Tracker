<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AirconMech project tracker</title>
<meta name="theme-color" content="#832F84">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<script>
(function(){var t=null;try{t=localStorage.getItem("pmt-theme")}catch(e){}
if(t!=="light"&&t!=="dark")t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
document.documentElement.setAttribute("data-theme",t);})();
</script>
<style>
:root{
  --paper:#F6F2F6; --surface:#FFFFFF; --ink:#22152A; --muted:#66576B; --line:#DACCDA; --soft:#EEE6EE;
  --brand:#832F84; --gold:#FBB900; --accent:#832F84;
  --fsa:#832F84; --myd:#A87C00; --ml:#3A6788; --late:#B3352E; --ok:#2C7646; --warn:#A86400; --focus:#832F84;
  --redbg:#F8DFDC; --ambg:#FDEFC8; --okbg:#DDEFE3; --newbg:#FAF7FA; --secbg:#EFE3F0; --inbg:#FFF8DC;
  --hdr:#FFFFFF; --hdr-ink:#832F84; --hdr-mut:#66576B; --hdr-line:#E3D6E3; --hdr-hov:#F5EEF5;
  color-scheme:light;
  box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#161017; --surface:#201722; --ink:#F0E9F0; --muted:#AE9FB0; --line:#412E43; --soft:#2E2131;
    --accent:#E2A8E3;
    --fsa:#DDA0DF; --myd:#FBB900; --ml:#80B2D6; --late:#E46D64; --ok:#62BD80; --warn:#E19A3A; --focus:#E2A8E3;
    --redbg:#4A2523; --ambg:#47371A; --okbg:#1E3A29; --newbg:#1A131C; --secbg:#2F2032; --inbg:#3A3220;
    --hdr:#1C1220; --hdr-ink:#FFFFFF; --hdr-mut:rgba(255,255,255,.72); --hdr-line:rgba(255,255,255,.28); --hdr-hov:rgba(255,255,255,.08);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#161017; --surface:#201722; --ink:#F0E9F0; --muted:#AE9FB0; --line:#412E43; --soft:#2E2131;
  --accent:#E2A8E3;
  --fsa:#DDA0DF; --myd:#FBB900; --ml:#80B2D6; --late:#E46D64; --ok:#62BD80; --warn:#E19A3A; --focus:#E2A8E3;
  --redbg:#4A2523; --ambg:#47371A; --okbg:#1E3A29; --newbg:#1A131C; --secbg:#2F2032; --inbg:#3A3220;
    --hdr:#1C1220; --hdr-ink:#FFFFFF; --hdr-mut:rgba(255,255,255,.72); --hdr-line:rgba(255,255,255,.28); --hdr-hov:rgba(255,255,255,.08);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--hdr)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.45;
  font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto;padding:20px 20px 48px;background:var(--paper)}
body>.wrap{min-height:calc(100vh - 90px)}

/* Brand bar: colour logo on white in light mode, white logo on near-black aubergine in dark mode */
.brandbar{background:var(--hdr);color:var(--hdr-ink);border-bottom:1px solid var(--hdr-line);box-shadow:inset 0 -4px 0 var(--gold);
  padding-top:env(safe-area-inset-top,0px)}
.brandin{max-width:1440px;margin:0 auto;padding:12px 20px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.logo{background:none;border:0;border-radius:4px;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.logo img{height:72px;width:auto;max-width:260px;display:block}
.logo .ph{color:var(--hdr-ink);font-size:.78rem;font-weight:700;line-height:1.15;text-align:center;border:1.5px dashed currentColor;
  border-radius:4px;padding:6px 8px}
.logo:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.titles{min-width:0;flex:1 1 260px;padding-left:18px;border-left:1px solid var(--hdr-line)}
.name{font-stretch:72%;font-weight:800;font-size:clamp(1.5rem,3.4vw,2.2rem);line-height:1.05;letter-spacing:-.005em;margin:0;
  padding:2px 4px;margin-left:-4px;border-radius:4px;min-width:6ch;color:var(--hdr-ink)}
.name:hover{background:var(--hdr-hov)}
.name:focus-visible{outline-color:var(--gold)}
.sub{color:var(--hdr-mut);font-size:.84rem;margin-top:4px}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--hdr-mut);display:inline-block}
.sync.live i{background:var(--gold)}
.topbtns{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.brandbar .btn{background:transparent;color:var(--hdr-ink);border-color:var(--hdr-line);border-radius:999px;padding:7px 16px}
.brandbar .btn:hover{background:var(--brand);border-color:var(--brand);color:#fff}
.brandbar .btn:focus-visible{outline-color:var(--gold)}
/* refresh button */
.iconbtn{display:inline-flex;align-items:center;gap:7px}
.iconbtn svg{width:15px;height:15px;flex:none}
.iconbtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* light / dark switch */
.themesw{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:4px 6px;cursor:pointer;color:var(--hdr-mut);font-size:.82rem;font-weight:600;border-radius:999px}
.themesw:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.themesw .trk{position:relative;width:52px;height:28px;border-radius:999px;background:var(--hdr-hov);border:1px solid var(--hdr-line);flex:none}
.themesw .knob{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--gold);transition:transform .2s ease;
  display:flex;align-items:center;justify-content:center;color:#1C1220}
.themesw[aria-checked="true"] .knob{transform:translateX(24px)}
.themesw svg{width:14px;height:14px;display:block}
.themesw .moon{display:none} .themesw[aria-checked="true"] .moon{display:block} .themesw[aria-checked="true"] .sun{display:none}
@media (max-width:760px){.brandin{gap:10px 12px}.titles{flex:1 1 0;padding-left:12px}.name{font-size:1.45rem}.sub{font-size:.76rem}.logo img{height:46px!important}.topbtns{width:100%}.themesw .lbl{display:none}}

/* Package lanes */
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:22px}
.lane{--c:var(--fsa);position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-top:7px solid var(--c);border-radius:3px 3px 6px 6px;padding:12px 14px 12px;cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease}
.lane[data-pkg="MYD"]{--c:var(--myd)} .lane[data-pkg="ML"]{--c:var(--ml)}
.lane:hover{border-color:var(--c)}
.lane[aria-pressed="true"]{box-shadow:0 0 0 2px var(--c) inset;transform:translateY(-2px)}
.lane .code{font-stretch:62%;font-weight:800;font-size:3rem;line-height:.9;color:var(--c);letter-spacing:-.01em}
.lane .pk{font-size:.82rem;color:var(--muted);margin:2px 0 10px}
.lane dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:.88rem}
.lane dt{color:var(--muted)} .lane dd{margin:0;font-weight:650;text-align:right}
.lane dd.bad{color:var(--late)}
.lane .hint{position:absolute;top:10px;right:12px;font-size:.75rem;color:var(--muted)}

/* Toolbar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
/* always-visible scroll bars on the scrolling areas */
#scrollarea,#tablebox,#progbox,#tlbox{scrollbar-width:auto;scrollbar-color:var(--line) transparent}
#scrollarea::-webkit-scrollbar,#tablebox::-webkit-scrollbar,#progbox::-webkit-scrollbar,#tlbox::-webkit-scrollbar{width:12px;height:12px}
#scrollarea::-webkit-scrollbar-thumb,#tablebox::-webkit-scrollbar-thumb,#progbox::-webkit-scrollbar-thumb,#tlbox::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:3px solid var(--paper)}
#scrollarea::-webkit-scrollbar-thumb:hover,#tablebox::-webkit-scrollbar-thumb:hover,#progbox::-webkit-scrollbar-thumb:hover,#tlbox::-webkit-scrollbar-thumb:hover{background:var(--muted)}
#scrollarea::-webkit-scrollbar-track,#tablebox::-webkit-scrollbar-track,#progbox::-webkit-scrollbar-track,#tlbox::-webkit-scrollbar-track{background:transparent}
#scrollarea::-webkit-scrollbar-corner,#tablebox::-webkit-scrollbar-corner{background:transparent}
#scrollarea .filterline{margin-top:4px}
/* app shell with the left-hand menu */
.shell{display:flex;align-items:stretch;min-height:0}
.sidenav{flex:none;width:264px;display:flex;flex-direction:column;gap:2px;background:var(--surface);border-right:1px solid var(--line);padding:14px 10px}
.navhead{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:2px 10px 8px}
.sidenav .navi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;border-radius:0 8px 8px 0;
  padding:10px 10px 10px 9px;margin:0;cursor:pointer;color:var(--muted);font-weight:650;font-size:.95rem;font-stretch:92%}
.sidenav .navi svg{width:18px;height:18px;flex:none}
.sidenav .navi .nl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidenav .navi .n{font-size:.75rem;font-weight:700;min-width:22px;text-align:center;padding:1px 6px;margin:0;border-radius:999px;background:var(--soft);color:var(--muted)}
.sidenav .navi:hover{background:var(--soft);color:var(--ink)}
.sidenav .navi[aria-current="page"]{color:var(--accent);background:var(--secbg);border-left-color:var(--brand)}
.sidenav .navi[aria-current="page"] .n{background:var(--brand);color:#fff}
.wrap{display:flex;flex-direction:column}
.wrap>.lanes{order:3}
.ptitle{margin:0;padding:8px 0 10px;font-stretch:76%;font-weight:800;font-size:1.55rem;color:var(--ink)}
.tabs{display:flex;gap:2px;margin-right:auto}
.tab{background:none;border:0;padding:10px 12px 9px;cursor:pointer;color:var(--muted);font-weight:600;
  border-bottom:3px solid transparent;margin-bottom:-1px;font-stretch:88%;font-size:1.05rem}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-weight:500;color:var(--muted);margin-left:4px;font-size:.9rem}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-bottom:8px}
.search{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;width:220px;max-width:100%}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);cursor:pointer;user-select:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.filterline{font-size:.84rem;color:var(--muted);margin:0 0 10px;min-height:1.2em}
.filterline button{background:none;border:0;padding:0;color:var(--focus);cursor:pointer;text-decoration:underline}

/* Spreadsheet grid */
.tablebox{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;
  max-height:calc(100vh - 230px);min-height:260px;-webkit-overflow-scrolling:touch}
table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed}
.grid th,.grid td{border-right:1px solid var(--soft);border-bottom:1px solid var(--soft);padding:0;vertical-align:top;background:var(--surface)}
.grid th{position:sticky;top:0;z-index:2;background:var(--paper);font-size:.78rem;font-weight:650;color:var(--muted);
  text-align:left;padding:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--line)}
.grid th:first-child,.grid td:first-child{position:sticky;left:0;z-index:1;border-right:1px solid var(--line)}
.grid th:first-child{z-index:3}
.grid td.ro{padding:8px;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid td:first-child{font-weight:650}
.cell{display:block;width:100%;border:0;background:transparent;padding:8px;font-size:.9rem;line-height:1.35;
  border-radius:0;min-height:36px;margin:0;color:var(--ink)}
textarea.cell{resize:none;overflow:hidden;font-family:inherit;height:36px}
.cell:focus{outline:2px solid var(--focus);outline-offset:-2px;background:var(--surface);position:relative;z-index:1}
.cell::placeholder{color:var(--muted);opacity:1;font-style:italic}
select.cell{appearance:none;-webkit-appearance:none;padding-right:22px;cursor:pointer;text-overflow:ellipsis;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 13px) 15px,calc(100% - 9px) 15px;background-size:4px 4px;background-repeat:no-repeat}
select.cell:focus{background-color:var(--surface)}
input[type="date"].cell{min-width:0;font-size:.86rem}
.cell:disabled{cursor:default;opacity:1;-webkit-text-fill-color:var(--ink)}
td.pk{--c:var(--fsa);box-shadow:inset 4px 0 0 var(--c)}
td.pk.MYD{--c:var(--myd)} td.pk.ML{--c:var(--ml)} td.pk.ALL{--c:var(--muted)}
td.pk .cell{font-weight:800;font-stretch:72%;font-size:1rem;color:var(--c);padding-left:12px}
td[data-v="High"],td[data-v="Critical"]{background:var(--redbg)}
td[data-v="Medium"],td[data-v="Mitigating"],td[data-v="In progress"],td[data-v="In Progress"],td[data-v="Doing"],td[data-v="Responded"]{background:var(--ambg)}
td[data-v="Resolved"],td[data-v="Closed"],td[data-v="Done"],td[data-v="Complete"]{background:var(--okbg)}
td[data-v="Programme"],td[data-v="Cost"]{background:var(--ambg)}
td[data-v="Programme and cost"]{background:var(--redbg)}
td.od .cell{color:var(--late);font-weight:650}
.grid tr.closed .cell,.grid tr.closed td.ro{color:var(--muted)}
.grid tr.closed td:first-child{text-decoration:line-through;text-decoration-color:var(--line)}
.grid tr.newrow td{background:var(--newbg)}
.grid tr.newrow td:first-child{color:var(--muted);font-weight:400}
.slip{font-weight:700} .slip.pos{color:var(--late)} .slip.neg{color:var(--ok)}
.late{color:var(--late);font-weight:650}
td.dc{text-align:center}
.del{border:0;background:none;color:var(--muted);font-size:1.15rem;line-height:1;cursor:pointer;padding:8px 6px;opacity:0;border-radius:4px}
.grid tr:hover .del,.grid tr:focus-within .del,.del:focus-visible{opacity:1}
.del:hover{color:var(--late)}
@media (hover:none){.del{opacity:.55}}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}

/* Timeline */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 14px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.tl{max-width:920px}
.tlm{font-stretch:76%;font-weight:800;font-size:1.3rem;color:var(--accent);margin:20px 0 6px}
.tlm:first-child{margin-top:4px}
.tll{list-style:none;margin:0;padding:0;position:relative}
.tll::before{content:"";position:absolute;left:61px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tli{--c:var(--fsa);position:relative;display:grid;grid-template-columns:44px 1fr;gap:34px;padding:5px 0;cursor:pointer;outline:none}
.tli.MYD{--c:var(--myd)} .tli.ML{--c:var(--ml)} .tli.ALL{--c:var(--muted)}
.tli::before{content:"";position:absolute;left:55px;top:17px;width:10px;height:10px;border-radius:50%;background:var(--c);border:2px solid var(--paper);box-sizing:content-box}
.tld{text-align:right;line-height:1.05;padding-top:9px}
.tld b{display:block;font-size:1.45rem;font-stretch:70%;font-weight:800}
.tld span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tlc{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;padding:9px 12px 10px;transition:border-color .15s}
.tli:hover .tlc,.tli:focus-visible .tlc{border-color:var(--c)}
.tli:focus-visible .tlc{box-shadow:0 0 0 2px var(--focus)}
.tlh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:.78rem;color:var(--muted)}
.tlpk{font-weight:800;font-stretch:72%;font-size:.95rem;color:var(--c)}
.tltype{font-weight:650;color:var(--ink)}
.imp{font-size:.72rem;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--ambg);color:var(--ink)}
.imp.both{background:var(--redbg)}
.tltitle{font-weight:650;margin-top:3px;font-size:.98rem}
.tlc p{margin:4px 0 0;font-size:.9rem;white-space:pre-wrap;color:var(--ink)}
.tlmeta{margin-top:6px;font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.tlempty{border:1.5px dashed var(--line);border-radius:8px;padding:44px 20px;text-align:center;color:var(--muted);background:var(--surface)}
.tlempty button{margin-top:10px}

/* Progress tracker */
.ptop{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:2px 0 14px}
.pkpills{display:flex;gap:6px}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{background:#6C2470;border-color:#6C2470;color:#fff}
.btn.primary:disabled{opacity:.6;cursor:wait}
.pp{--c:var(--fsa);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 18px;font-weight:800;
  font-stretch:72%;font-size:1.05rem;color:var(--muted);cursor:pointer}
.pp.MYD{--c:var(--myd)} .pp.ML{--c:var(--ml)}
.pp:hover{border-color:var(--c);color:var(--c)}
.pp[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--surface)}
.pempty{border:1.5px dashed var(--line);border-radius:8px;padding:56px 20px;text-align:center;color:var(--muted);background:var(--surface)}
.pempty .big{font-stretch:72%;font-weight:800;font-size:1.7rem;color:var(--ink);margin:0 0 6px}
.pempty p{margin:0}
.pmeta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:6px;background:var(--surface);
  overflow:hidden;margin-bottom:14px}
.mf{display:flex;flex-direction:column;border-right:1px solid var(--soft);border-bottom:1px solid var(--soft);padding-top:7px;margin-right:-1px;margin-bottom:-1px}
.mf>span{font-size:.75rem;color:var(--muted);font-weight:650;padding:0 8px}
.mf .cell{min-height:32px;padding-top:4px}
.overall{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px 24px;background:var(--brand);color:#fff;border-radius:6px;
  padding:14px 20px;margin-bottom:14px;border-bottom:4px solid var(--gold)}
.olabel{font-size:.84rem;opacity:.9;font-weight:600}
.onum{font-stretch:66%;font-weight:800;font-size:2.8rem;line-height:1;color:var(--gold);margin:2px 0}
.osub{font-size:.78rem;opacity:.78}
.obar{height:14px;background:rgba(255,255,255,.2);border-radius:7px;overflow:hidden}
.obar i{display:block;height:100%;background:var(--gold);border-radius:7px;transition:width .35s ease}
.grid tr.sec td{background:var(--secbg);font-weight:750;padding:7px 8px;font-size:.88rem;color:var(--ink)}
.grid tr.sec td.secp{text-align:right;font-weight:700}
.grid td.done{background:var(--inbg)}
.grid tr.over td.done{box-shadow:inset 0 0 0 2px var(--warn)}
.cell.num{text-align:right;font-variant-numeric:tabular-nums}
#lahead{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin:0 0 10px}
.lactl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.lactl.old{padding:10px 12px}
.lactl label{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted);font-weight:600}
.lactl input[type=date]{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 8px}
.lactl .nav{display:flex;gap:6px}
.lactl .nav button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 10px;cursor:pointer;font-weight:600;color:var(--ink)}

const STATUS_MAP={todo:{"To do":"Not started","Doing":"In Progress","In progress":"In Progress","Done":"Complete"},action:{"In progress":"Open"}};
function normItem(i){const m=STATUS_MAP[i.kind];if(m&&m[i.status])i.status=m[i.status];
  if(i.kind==="look"&&!Array.isArray(i.names)){i.names=splitNames(i.name);i.name=i.names.join(", ")}
  if(i.kind==="look"&&!i.week&&!i.date)lookFromRange(i,i.from,i.to,i.title);
  if(i.kind==="action"&&i.status==="Closed"&&!i.closedOn){const d=i.updatedAt?new Date(i.updatedAt):new Date();i.closedOn=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
  return i}
/* several names per look-ahead row */
function splitNames(s){const out=[];String(s||"").split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean).forEach(n=>{if(!out.some(o=>o.toLowerCase()===n.toLowerCase()))out.push(n)});return out}
function namesOf(i){return Array.isArray(i.names)?i.names:splitNames(i.name)}
function withNames(it,list){it.names=splitNames(list.join(","));it.name=it.names.join(", ");return it}
const chipHtml=n=>`<span class="chip">${esc(n)}${readOnly?"":`<button class="chipx" data-rmname="${esc(n)}" aria-label="Remove ${esc(n)}" title="Remove">×</button>`}</span>`;
function namesCell(i){const ns=i?namesOf(i):[];
  return `<td class="namescell"><div class="chips">${ns.map(chipHtml).join("")}${readOnly?"":`<input type="text" class="cell chipin" data-k="name" aria-label="Add a name" placeholder="${ns.length?"+ name":"Type a name, press Enter"}">`}</div></td>`}
function renderChips(td,i){const box=td.querySelector(".chips");if(!box)return;box.querySelectorAll(".chip").forEach(x=>x.remove());
  const inp=box.querySelector(".chipin"), html=namesOf(i).map(chipHtml).join("");
  if(inp){inp.insertAdjacentHTML("beforebegin",html);inp.placeholder=namesOf(i).length?"+ name":"Type a name, press Enter"}else box.innerHTML=html}

function progCommit(el){
  if(readOnly)return;
  const host=el.closest("[data-id]");if(!host)return;
  const id=host.dataset.id.split("~")[0],k=el.dataset.k, val=el.type==="date"?el.value:el.value.trim();
  const P=getProg(progPkg);if(!P)return;
  let cur;
  if(id==="meta"){cur=P.meta[k]||"";if(cur===val)return;P.meta[k]=val}
  else if(/^S\d+$/.test(id)){const sec=P.sections[+id.slice(1)];if(!sec)return;cur=sec.name||"";if(cur===val)return;if(!val){el.value=cur;return}sec.name=val}

  else{
    const line=allLines(P).find(l=>l.id===id);if(!line)return;cur=line[k]==null?"":String(line[k]);if(cur===val)return;
    if(k==="mat"||k==="lab"||k==="pct"){
      const v=val.replace(/%\s*$/,"").trim(), n=num(v);
      if(v!==""&&(n==null||n<0||n>100)){el.value=cur;toast("Enter a percentage from 0 to 100.");return}
      if(v!==val)el.value=v;
      if(cur===v)return;line[k]=v;progress[progPkg]=P;patchProg(P);renderLanes();saveProg(progPkg);return;
    }
    if((k==="done"||k==="qty")&&val!==""&&(num(val)==null||num(val)<0)&&!(k==="qty"&&/^tbc$/i.test(val))){
      el.value=cur;toast(k==="done"?"Enter a number for done to date.":"Enter a number or TBC for scope qty.");return}
    line[k]=val;
  }
  progress[progPkg]=P;
  patchProg(P);renderLanes();saveProg(progPkg);
}

/* ---------- column order and widths (saved on this device) ---------- */
const COLKEY="pmt-cols";

function colsFor(v){
  const base=GRID[v]||[], L=colLayout[v];let out=base;
  if(L&&L.order){const byK=new Map(base.map(c=>[c.k,c]));out=[];
    L.order.forEach(k=>{if(byK.has(k)){out.push(byK.get(k));byK.delete(k)}});
    base.forEach(c=>{if(byK.has(c.k))out.push(c)})}
  if(v==="rfi")out=out.filter(c=>c.k!=="pkg");
  if(v==="look"&&lookPkg==="ALL"&&!out.some(c=>c.k==="pkg")){out=out.slice();const at=out.findIndex(c=>c.k==="date");out.splice(at+1,0,PKG)}
  return v==="look"&&!laWeekend?out.filter(c=>c.k!=="d6"&&c.k!=="d7"):out;
}
function colW(v,c){const L=colLayout[v];return (L&&L.w&&L.w[c.k])||c.w+16}
function moveCol(v,k,toK,after){

  let at=toK==null?order.length:order.indexOf(toK)+(after?1:0);if(at<0)at=order.length;
  order.splice(at,0,k);
  (colLayout[v]=colLayout[v]||{}).order=order;saveLayout();tableKey="";syncTable();
}
function shiftCol(v,k,dir){

  [order[i],order[j]]=[order[j],order[i]];(colLayout[v]=colLayout[v]||{}).order=order;saveLayout();tableKey="";syncTable();

function commit(el){
  if(readOnly)return;
  const tr=el.closest("tr");if(!tr)return;
  const id=tr.dataset.id, k=el.dataset.k;
  const val=(el.tagName==="SELECT"||el.type==="date")?el.value:el.value.trim();
  if(id==="new"){
    if(k==="pkg"){newPkg=val;el.closest("td").className="pk "+val;return}
    if(!val)return;
    const it={id:newId(),kind:view,createdAt:Date.now(),pkg:newPkg,status:opt(view,"status")[0]};
    if(view==="delay"){it.identified=today();it.eot="To be assessed"}
    if(view==="action"||view==="rfi")it.raised=today();
    if(view==="event"&&k!=="date")it.date=today();
    if(view==="look"){it.date=tr.dataset.date||laStart;it.pkg=lookPkg==="ALL"?newPkg:lookPkg}
    if(view==="rfi")it.pkg=rfiPkg;
    it[k]=val;it.ref=nextRef(view,it.pkg,it.id);
    if(el.classList.contains("chipin")){withNames(it,[val]);el.value=""}
    tr.dataset.id=it.id;tr.classList.remove("newrow");
    const t=tr.querySelector('.cell[data-k="title"]');if(t)t.removeAttribute("placeholder");
    const st=tr.querySelector('select[data-k="status"]');if(st&&st.options[0]&&st.options[0].value==="")st.remove(0);
    tr.lastElementChild.outerHTML=delCell(it);
    putItem(it,true);patchRow(tr,it);
    if(view==="look"){setTimeout(()=>{tableKey="";syncTable()},0);return}
    tr.insertAdjacentHTML("afterend",rowHtml(null));
    if(pkgFilter!=="ALL"&&it.pkg!==pkgFilter)toast(`${it.ref} added to ${it.pkg}.`);
    return;
  }
  const old=items.get(id);if(!old)return;
  if(el.classList.contains("chipin")){if(!val)return;const it=withNames({...old},namesOf(old).concat(splitNames(val)));el.value="";putItem(it,true);patchRow(tr,it);return}
  if((old[k]==null?"":String(old[k]))===val)return;
  const it={...old};it[k]=val;
  if(k==="pkg")it.ref=nextRef(it.kind,val,it.id);
  if(it.kind==="rfi"&&k==="respDate"&&val&&it.status==="Open")it.status="Responded";
  if(k==="status"){if(isClosed(it)&&!it.closedOn)it.closedOn=today();if(!isClosed(it))delete it.closedOn}
  putItem(it,true);patchRow(tr,it);
  if(it.kind==="look"&&k==="date")setTimeout(()=>{tableKey="";syncTable()},0);
}
function moveTo(tr,k,up){
  while(tr&&tr.classList&&tr.classList.contains("wkrow"))tr=up?tr.previousElementSibling:tr.nextElementSibling;
  if(!tr)return;const el=tr.querySelector(`.cell[data-k="${k}"]`);if(!el)return;
  el.focus();if(el.type==="text"||el.tagName==="TEXTAREA"){const n=el.value.length;try{el.setSelectionRange(n,n)}catch(e){}}
}

box.addEventListener("input",e=>{if(e.target.tagName==="TEXTAREA")grow(e.target)});
box.addEventListener("change",e=>{const s=e.target.closest&&e.target.closest(".selbox");if(!s)return;

  if(el.classList.contains("chipin")){
    if(e.key==="Enter"||e.key===","||e.key===";"){e.preventDefault();commit(el);return}
    if(e.key==="Backspace"&&!el.value){const it0=items.get(tr.dataset.id);if(it0&&namesOf(it0).length){const it=withNames({...it0},namesOf(it0).slice(0,-1));putItem(it,true);patchRow(tr,it)}return}

  }

  if(el.type==="text"&&(e.key==="ArrowDown"||e.key==="ArrowUp")){

  const dup=e.target.closest("[data-dup]");

    const it={...src,id:newId(),createdAt:Date.now(),name:"",names:[],comments:""};it.ref=nextRef("look",it.pkg,it.id);

  const b=e.target.closest(".del");if(!b)return;
  const it=items.get(b.closest("tr").dataset.id);if(!it)return;
  if(confirm(`Delete ${it.ref}${it.title?": "+it.title.slice(0,60):""}? This cannot be undone.`)){removeItem(it.id);toast(`${it.ref} deleted.`)}
});

/* ---------- one-page PDF progress report ---------- */
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src})}
async function logoForPdf(){
  const src=projectLogo||repoLogo||DEFAULT_LOGO;
  try{
    const im=await loadImg(src), w=im.naturalWidth||344, h=im.naturalHeight||150;
    if(/^data:image\/(png|jpe?g)/i.test(src))return {data:src,fmt:/^data:image\/jpe?g/i.test(src)?"JPEG":"PNG",w,h};
    const k=Math.min(4,900/w), cv=document.createElement("canvas");cv.width=Math.round(w*k);cv.height=Math.round(h*k);
    cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);return {data:cv.toDataURL("image/png"),fmt:"PNG",w:cv.width,h:cv.height};
  }catch(e){const im=await loadImg(DEFAULT_LOGO);return {data:DEFAULT_LOGO,fmt:"PNG",w:im.naturalWidth,h:im.naturalHeight}}
}
function fmtDMY(v){const d=iso(v)||v;const m=String(d||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1]}`:String(d||"")}
async function buildProgressPdf(pkg,P){

  const o=avgPct(allLines(P));

  let LHF=1.22;

    padK=padK||1.35;

      if(stroke){doc.setDrawColor(...LINE);doc.setLineWidth(0.15);doc.rect(x,y,w,h,"S")}};
    const txt=(t,x,y,opt)=>{if(draw)doc.text(t,x,y,Object.assign({baseline:"top",lineHeightFactor:LHF},opt||{}))};

    const tx=M+4*s+lW+7*s, tw=CW-(tx-M)-4*s;
    const tl=wrap(title,tw,13*s,true), tH=tl.length*13*s*0.3528*1.15, gH=7.6*s*0.3528;
    const top=y+(hb-(tH+1.8*s+gH))/2;

      const h=Math.max(lv.length,rv.length,1)*lh+2*pad;

        cx+=pcW;

        y+=h;

    });

    box(M,y,CW,oh,GOLD,true);F(fs*1.05,true,INK);txt(overLabel(P),M+padX,y+pad+0.4*s);
    txt(pct1(o.avg),M+pcX+pcW-padX,y+pad+0.4*s,{align:"right"});
    y+=oh+3.5*s;

    const iss=wrap(P.issues||"",CW-2*padX,fs,false), ih=Math.max(iss.length*lh+2*pad,16*s);
    box(M,y,CW,ih,null,true);F(fs,false,INK);txt(P.issues?iss:"",M+padX,y+pad);
    y+=ih+3.5*s;
    // look-ahead
    bar("Look-ahead – next period");
    const lkw=52*s;
    PLOOK.forEach(([k,lab])=>{
      const v=wrap((P.look||{})[k]||"",CW-lkw-2*padX,fs,false), h=Math.max(v.length,1)*lh+2*pad+1*s;
      box(M,y,lkw,h,LAV,true);box(M+lkw,y,CW-lkw,h,null,true);
      F(fs,true,INK);txt(lab+":",M+padX,y+pad);F(fs,false,INK);txt(v,M+lkw+padX,y+pad);y+=h});
    // footer

      doc.text(["AirconMech",title,P.meta.period].filter(Boolean).join("  |  "),M,H-M,{baseline:"bottom"});
      doc.text([P.meta.preparedBy&&"Prepared by "+P.meta.preparedBy,P.meta.reportDate&&"Report date "+fmtDMY(P.meta.reportDate)].filter(Boolean).join("  |  "),W-M,H-M,{align:"right",baseline:"bottom"})}

const LIST_PDF={

async function buildListPdf(kind,list,filterText){
  const {jsPDF}=window.jspdf, cfg=LIST_PDF[kind];
  const doc=new jsPDF({unit:"mm",format:"a4",orientation:"landscape",compress:true});
  const W=297,H=210,M=10,CW=W-2*M,BOTTOM=H-M-6;
  const PUR=[131,47,132],GOLD=[251,185,0],LAV=[239,227,240],INK=[34,21,42],MUT=[120,108,125],LINE=[205,190,206],WHITE=[255,255,255],RED=[179,53,46],ZEBRA=[250,247,250];
  const logo=await logoForPdf();
  const fs=7.4, lh=fs*0.3528*1.2, pad=1.3, px=1.4;
  const F=(size,bold,c)=>{doc.setFont("helvetica",bold?"bold":"normal");doc.setFontSize(size);doc.setTextColor(...c)};
  const T=(t,x,y,o)=>doc.text(t,x,y,Object.assign({baseline:"top",lineHeightFactor:1.2},o||{}));
  const rect=(x,y,w,h,fill,stroke)=>{if(fill){doc.setFillColor(...fill);doc.rect(x,y,w,h,"F")}if(stroke){doc.setDrawColor(...LINE);doc.setLineWidth(0.15);doc.rect(x,y,w,h,"S")}};
  const wrap=(t,w)=>doc.splitTextToSize(String(t==null?"":t),Math.max(w,3));
  let y=M;
  // first-page header
  const hb=21;rect(M,y,CW,hb,PUR);rect(M,y+hb,CW,1.2,GOLD);
  const lH=hb-6,lW=Math.min(lH*logo.w/logo.h,52);doc.addImage(logo.data,logo.fmt,M+4,y+3,lW,lW*logo.h/logo.w);
  const tx=M+4+lW+7;
  F(15,true,WHITE);T(cfg.title,tx,y+4.2);
  F(8.5,false,[246,228,247]);T(projectName||"Project tracker",tx,y+11.4);
  F(7.5,false,[246,228,247]);T("Issued "+fmtDMY(today()),M+CW-4,y+4.6,{align:"right"});
  if(filterText)T(filterText,M+CW-4,y+11.6,{align:"right"});
  y+=hb+1.2+4;
  // key figures
  const sm=cfg.summary(list), cw=sm.length<=2?(CW-3*(sm.length-1))/sm.length:Math.min(62,CW/sm.length), ch=11.5;
  sm.forEach(([lab,val],k)=>{const x=M+k*(cw+3);rect(x,y,cw,ch,LAV);rect(x,y,1.2,ch,PUR);
    F(7,false,MUT);T(lab,x+4,y+2);F(String(val).length>18?9:11,true,INK);T(String(val),x+4,y+5.6)});
  y+=ch+5;
  const cols=typeof cfg.cols==="function"?cfg.cols(list):cfg.cols, scale=CW/cols.reduce((a,c)=>a+c[1],0), widths=cols.map(c=>c[1]*scale);
  const headRow=()=>{const h=lh+2*pad+0.6;let x=M;cols.forEach((c,k)=>{rect(x,y,widths[k],h,GOLD,true);F(fs,true,INK);
      if(c[2]==="r")T(c[0],x+widths[k]-px,y+pad+0.3,{align:"right"});else T(c[0],x+px,y+pad+0.3);x+=widths[k]});y+=h};
  const newPage=()=>{doc.addPage();y=M;const bh=8;rect(M,y,CW,bh,PUR);rect(M,y+bh,CW,0.8,GOLD);
    F(9,true,WHITE);T(cfg.title+" (continued)",M+3,y+2.2);F(7.5,false,[246,228,247]);T(projectName||"",M+CW-3,y+2.6,{align:"right"});y+=bh+0.8+3;headRow()};
  headRow();
  let lastMonth=null, zebra=false;
  list.forEach(i=>{
    if(cfg.group){const g=cfg.group(i);
      if(g.key!==lastMonth){lastMonth=g.key;const h=lh+2*pad;if(y+h+lh*2>BOTTOM)newPage();
        rect(M,y,CW,h,LAV,true);F(fs,true,INK);T(g.label,M+px,y+pad);y+=h;zebra=false}}
    const vals=cfg.row(i);
    const cells=vals.map((v,k)=>{F(fs,k===0||!!cfg.tone(i,k),INK);return wrap(v,widths[k]-2*px)});
    const h=Math.max(...cells.map(c=>c.length),1)*lh+2*pad;
    if(y+h>BOTTOM)newPage();
    const closed=kind!=="event"&&kind!=="look"&&isClosed(i);
    let x=M;
    cells.forEach((c,k)=>{
      rect(x,y,widths[k],h,zebra?ZEBRA:null,true);
      const tone=cfg.tone(i,k);
      F(fs,k===0||!!tone,tone==="red"?RED:tone==="amber"?[176,104,0]:tone==="green"?[44,118,70]:(closed?MUT:INK));
      if(cols[k][2]==="r")T(c,x+widths[k]-px,y+pad,{align:"right"});else T(c,x+px,y+pad);
      x+=widths[k];
    });
    y+=h;zebra=!zebra;
  });
  const n=doc.getNumberOfPages();
  for(let k=1;k<=n;k++){doc.setPage(k);F(7,false,MUT);
    doc.text(["AirconMech",cfg.title,projectName].filter(Boolean).join("  |  "),M,H-M,{baseline:"bottom"});
    doc.text(`Page ${k} of ${n}`,W-M,H-M,{align:"right",baseline:"bottom"})}
  doc.setProperties({title:cfg.title+(projectName?" – "+projectName:""),author:"AirconMech",creator:"AirconMech project tracker"});
  return doc.output("arraybuffer");
}

async function exportPdf(){

  const setBtn=(busy)=>{const b=$("pdfBtn");if(b){b.disabled=busy;b.textContent=busy?"Preparing PDF…":"Download PDF report"}};
  setBtn(true);
  try{
    const {buf,fits,base}=await buildProgressPdf(progPkg,P);
    const name=(base+" Progress Report "+(P.meta.period||today())).replace(/[\/\\]/g,"-").replace(/[–—]/g,"-").replace(/[^\w\-. ]+/g,"").replace(/\s+/g," ").trim()+".pdf";
    await downloads.save({filename:name,data:buf});
    toast(fits?"PDF report saved.":"PDF saved, but the report is too long for one page. Shorten the comments or issues and try again.");
  }catch(e){if(!(e&&(e.code==="declined"||e.code==="cancelled")))toast("The PDF could not be created. Try again.")}
  finally{setBtn(false)}
}

/* ---------- adding, removing and changing progress line items ---------- */
function progStructChanged(P,focus){
  progress[progPkg]=P;progRendered.sig=null;syncProg();renderLanes();saveProg(progPkg);
  if(focus){const el=$("progbox").querySelector(`[data-id="${focus[0]}"] .cell[data-k="${focus[1]}"]`);
    if(el){el.focus();const n=el.value.length;try{el.setSelectionRange(n,n)}catch(e){}}}
}
function progAddLine(si,text){
  const P=getProg(progPkg), sec=P&&P.sections[si];if(!sec)return;
  const pm=isPm(P), id="N"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  let sor="";
  if(pm||sec.sor){const n=sec.lines.reduce((m,l)=>{const x=String(l.sor||"").match(/(\d+)$/);return x?Math.max(m,+x[1]):m},0)+1;sor=sec.sor?sec.sor+"."+n:String(n)}
  let l;
  if(pm){const single=sec.lines.length>0&&sec.lines.filter(x=>x.single).length*2>sec.lines.length;
    l=single?{id,sor,item:text,pm:true,single:true,pct:"",comments:""}:{id,sor,item:text,pm:true,mat:"",lab:"",comments:""}}
  else l={id,sor,item:text,unit:"",qty:"",done:"",comments:""};
  sec.lines.push(l);
  progStructChanged(P,[id,"item"]);
}
function progAddSection(text){
  const P=getProg(progPkg);if(!P)return;
  const pm=isPm(P);
  const sor=pm?String(P.sections.reduce((m,x)=>Math.max(m,parseInt(x.sor,10)||0),0)+1):"";
  P.sections.push({sor,name:text,lines:[]});
  progStructChanged(P,["S"+(P.sections.length-1),"secname"]);
}
function progRowAction(btn){
  const P=getProg(progPkg);if(!P)return;
  const tr=btn.closest("tr"), act=btn.dataset.act;
  if(act==="delsec"){
    const si=+tr.dataset.sec, sec=P.sections[si];if(!sec)return;
    if(!confirm(`Delete the section "${sec.name}"${sec.lines.length?` and its ${sec.lines.length} line item${sec.lines.length===1?"":"s"}`:""}? This cannot be undone.`))return;
    P.sections.splice(si,1);progStructChanged(P);toast("Section deleted.");return;
  }
  let sec=null,li=-1;P.sections.forEach(x=>{const i=x.lines.findIndex(l=>l.id===tr.dataset.id);if(i>=0){sec=x;li=i}});
  if(!sec)return;const l=sec.lines[li];
  if(act==="del"){
    if(!confirm(`Delete ${l.sor?l.sor+" ":""}${String(l.item||"this line item").slice(0,70)}? Its progress will be removed from the report.`))return;
    sec.lines.splice(li,1);progStructChanged(P);toast("Line item deleted.");return;
  }
  if(act==="split"){
    if(l.single){l.mat=l.pct||"";l.lab=l.pct||"";delete l.pct;delete l.single}
    else{const a=num(l.mat),b=num(l.lab);l.pct=a==null&&b==null?"":String(Math.round(((a||0)+(b||0))/2*10)/10);delete l.mat;delete l.lab;l.single=true}
    progStructChanged(P,l.single?[l.id,"pct"]:[l.id+"~mat","mat"]);
  }
}

/* ---------- progress events ---------- */
const pbox=$("progbox");
pbox.addEventListener("click",e=>{if(e.target.closest("#pdfBtn"))return exportPdf();const ra=e.target.closest("[data-act]");if(ra&&!readOnly)return progRowAction(ra);const b=e.target.closest("[data-pp]");if(b){progPkg=b.dataset.pp;render()}});
// recalculate % complete as each digit is typed; save shortly after typing stops (and straight away on leaving the cell)
let progSaveT=null;
function flushProgSave(){if(progSaveT){clearTimeout(progSaveT);progSaveT=null;saveProg(progPkg)}}
window.addEventListener("pagehide",flushProgSave);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flushProgSave()});
function liveProg(el){
  const host=el.closest("[data-id]");if(!host)return;
  const id=host.dataset.id.split("~")[0], k=el.dataset.k, pctK=/^(mat|lab|pct)$/.test(k);
  let v=el.value.trim();if(pctK)v=v.replace(/%\s*$/,"").trim();
  const n=num(v);
  if(v!==""&&(n==null||n<0||(pctK&&n>100))&&!(k==="qty"&&/^tbc$/i.test(v)))return;
  const P=getProg(progPkg);if(!P)return;
  const line=allLines(P).find(l=>l.id===id);if(!line)return;
  if((line[k]==null?"":String(line[k]))===v)return;
  line[k]=v;progress[progPkg]=P;patchProg(P);renderLanes();
  clearTimeout(progSaveT);progSaveT=setTimeout(()=>{progSaveT=null;saveProg(progPkg)},600);
}
pbox.addEventListener("change",e=>{if(e.target.classList&&e.target.classList.contains("cell")){progCommit(e.target);flushProgSave()}});
pbox.addEventListener("input",e=>{
  const el=e.target;if(el.tagName==="TEXTAREA")grow(el);
  const k=el.dataset&&el.dataset.k;
  if(!readOnly&&/^(done|qty|mat|lab|pct)$/.test(k||"")){liveProg(el);return}
  if((k==="newitem"||k==="newsec")&&el.value&&!readOnly){
    const v=el.value;el.value="";el.blur();
    if(k==="newitem")progAddLine(+el.closest("tr").dataset.sec,v);else progAddSection(v);
  }
});
pbox.addEventListener("keydown",e=>{
  const el=e.target;if(!el.classList||!el.classList.contains("cell"))return;
  const host=el.closest("[data-id]"),k=el.dataset.k;
  if(e.key==="Escape"){progRendered.sig=null;el.blur();syncProg();return}
  const inTable=host&&host.tagName==="TR";
  if(inTable&&((e.key==="Enter"&&!e.shiftKey)||(el.tagName==="INPUT"&&(e.key==="ArrowDown"||e.key==="ArrowUp")))){
    e.preventDefault();progCommit(el);
    let tr=host;const up=e.key==="ArrowUp";
    const sel=/^(mat|lab|pct)$/.test(k)?'.cell[data-k="mat"],.cell[data-k="lab"],.cell[data-k="pct"]':`.cell[data-k="${k}"]`;
    do{tr=up?tr.previousElementSibling:tr.nextElementSibling}while(tr&&!tr.querySelector(sel));
    if(tr){const n=tr.querySelector(sel);n.focus();try{n.select()}catch(x){}}
  }
});

async function exportCsv(){
  if(!downloads)return;
  if(view==="progress"){
    const P=getProg(progPkg);if(!P){toast(`There is no ${progPkg} progress to export yet.`);return}
    const cell=v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
    const pm=isPm(P);
    const rows=[(pm?["Section","Ref","Item","Material %","Labour %","% complete","Comments"]:["Section","SOR","Line item","Unit","Scope qty","Done to date","% complete","Comments"]).join(",")];
    P.sections.forEach(sec=>sec.lines.forEach(l=>{const pc=linePct(l);
      rows.push((pm?[sec.name,l.sor,l.item,l.single?fmtP(l.pct):fmtP(l.mat),l.single?"":fmtP(l.lab),pct0(pc),l.comments]
        :[sec.name,l.sor,l.item,l.unit,l.qty,l.done,pc==null?"":pct0(pc),l.comments]).map(cell).join(","))}));
    rows.push((pm?["Overall progress","","","","",pct1(avgPct(allLines(P)).avg),""]:["Overall progress","","","","","",pct1(avgPct(allLines(P)).avg),""]).map(cell).join(","));
    try{await downloads.save({filename:`${progPkg}-progress-${today()}.csv`,data:"\ufeff"+rows.join("\r\n")});toast("Exported.")}
    catch(e){if(e&&e.code&&e.code!=="declined"&&e.code!=="cancelled")toast("Export did not complete.")}
    return;
  }
  const cols=colsFor(view).filter(c=>c.k!=="_od"), list=filtered();
  const cell=v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const val=(i,c)=>c.k==="_slip"?(slip(i)==null?"":slip(i)):c.k==="_ast"?actStatus(i):i[c.k];
  const noOd=view!=="todo";
  const head=cols.map(c=>c.l).concat(noOd?[]:["Overdue"]);
  const rows=[head.map(cell).join(",")].concat(list.map(i=>cols.map(c=>cell(val(i,c))).concat(noOd?[]:[overdue(i)?"Overdue":""]).join(",")));
  const name=(projectName||"tracker").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-")+"-"+SCHEMA[view].tab.toLowerCase().replace(/[^a-z]/g,"")+(pkgFilter==="ALL"?"":"-"+pkgFilter)+"-"+today()+".csv";
  try{await downloads.save({filename:name,data:"\ufeff"+rows.join("\r\n")});toast("Exported.")}
  catch(e){if(e&&e.code&&e.code!=="declined"&&e.code!=="cancelled")toast("Export did not complete.")}
}

const XL={
  delay:{sheet:"Delay Log",map:{"Ref":"ref","Package":"pkg","Delay description":"title","Cause":"cause","Impact":"impact","Date identified":"identified","Responsible party":"responsible","Planned date":"original","Forecast date":"revised","Status":"status","EOT claim":"eot","Mitigation / recovery plan":"mitigation","Date closed":"closedOn","Comments":"comments"}},
  action:{sheet:"Action Tracker",map:{"Action No.":"ref","Package":"pkg","Description":"title","Raised in":"source","Date Raised":"raised","Act Owner":"owner","Due Date":"due","Date Closed":"closedOn","Status":"status","Comments/Response":"notes"},
    alias:{"Ref":"ref","Action":"title","Owner":"owner","Raised at":"source","Date raised":"raised","Due date":"due","Update / comments":"notes","Date closed":"closedOn"}},
  look:{sheet:"Look Ahead",map:{"Ref":"ref","Package":"pkg","Date":"date","Area":"area","Names":"name","Task / work":"title","Comments":"comments"},
    alias:{"Name":"name","From":"from","To":"to","Description of work":"title","Week commencing":"week","Monday":"d1","Tuesday":"d2","Wednesday":"d3","Thursday":"d4","Friday":"d5","Saturday":"d6","Sunday":"d7"}},
  rfi:{sheet:"RFI Register",map:{"RFI No.":"ref","Package":"pkg","Subject":"title","Question / description":"question","Raised by":"raisedBy","Addressed to":"addressee","Date raised":"raised","Response due":"due","Date responded":"respDate","Response":"response","Status":"status","Comments":"comments"},alias:{"RFI":"ref","Ref":"ref","Question":"question","Due":"due"}},
  event:{sheet:"Timeline",map:{"Ref":"ref","Package":"pkg","Date":"date","Type":"type","Event":"title","Impact":"impact","Related ref":"related","Who":"who","Details / outcome":"notes"}},
  todo:{sheet:"To-Do List",map:{"Ref":"ref","Package":"pkg","Task":"title","Owner":"owner","Company":"company","Due date":"due","Priority":"priority","Status":"status","Notes":"notes"},alias:{"Who":"owner"}}
};
const DATEK=new Set(["identified","original","revised","closedOn","raised","due","date","from","to","week","respDate"]);
const p2=n=>String(n).padStart(2,"0");
function iso(v){
  if(typeof v==="number"&&v>20000){const d=new Date(Math.round((v-25569)*864e5));return d.getUTCFullYear()+"-"+p2(d.getUTCMonth()+1)+"-"+p2(d.getUTCDate())}
  if(typeof v==="string"){const s=v.trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+"-"+m[2]+"-"+m[3];
    m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);if(m){const y=m[3].length===2?"20"+m[3]:m[3];return y+"-"+p2(m[2])+"-"+p2(m[1])}}
  return "";
}
function parsePctProgress(rows,hi,T){
  const head=rows[hi].map(T), ci=n=>head.indexOf(n);
  const c={item:ci("Item"),mat:ci("Material %"),lab:ci("Labour %"),pc:ci("% complete"),comments:ci("Comments")}, rowsMode=c.mat<0;
  const P={mode:"pct",meta:{},sections:[],issues:"",look:{planned:"",deliveries:"",tests:""}};
  const MK={"Project":"project","Contractor":"contractor","Scope basis":"scope","Reporting period":"period","Report date":"reportDate","Prepared by":"preparedBy"};
  rows.slice(0,hi).forEach(r=>{const k=MK[T(r[0])];if(k)P.meta[k]=k==="reportDate"?(iso(r[1])||T(r[1])):T(r[1])});
  const toP=v=>{if(v===""||v==null)return "";if(typeof v==="number")return String(Math.round(v*1000)/10);const n=num(String(v).replace(/%\s*$/,""));return n==null?"":String(n)};
  let sec=null;
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i],a=T(r[0]),b=T(r[c.item]);
    if(/^Overall progress|^Issues, risks/i.test(a))break;
    if(!a&&!b)continue;
    if(a&&!b){const m=a.match(/^(\d+(?:\.\d+)*)\s+(.+)$/);sec={sor:m?m[1]:"",name:m?m[2]:a,lines:[]};P.sections.push(sec);continue}
    if(!sec){sec={sor:"",name:"Items",lines:[]};P.sections.push(sec)}
    if(rowsMode){
      const last=sec.lines[sec.lines.length-1];
      if(last&&/^[ab]$/i.test(a)&&/^(material|labour|labor)$/i.test(b)){
        if(last.single){delete last.single;delete last.pct;last.mat="";last.lab=""}
        last[/^m/i.test(b)?"mat":"lab"]=toP(r[c.pc]);continue;
      }
      sec.lines.push({id:"P"+(a||i)+"_"+i,sor:a,item:b,pm:true,single:true,pct:toP(r[c.pc]),comments:c.comments>=0?T(r[c.comments]):""});
      continue;
    }
    const labRaw=T(r[c.lab]), single=/^(–|-|—|n\/a)$/i.test(labRaw);
    const l={id:"P"+(a||i),sor:a,item:b,pm:true,comments:c.comments>=0?T(r[c.comments]):""};
    if(single){l.single=true;l.pct=toP(r[c.mat])}else{l.mat=toP(r[c.mat]);l.lab=toP(r[c.lab])}
    sec.lines.push(l);
  }
  return P;
}
function parseProgress(ws){
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
  const T=v=>String(v==null?"":v).trim();
  const phi=rows.findIndex(r=>T(r[0])==="Ref"&&(r.map(T).includes("Material %")||r.map(T).includes("% complete")));
  if(phi>=0){
    const P=parsePctProgress(rows,phi,T);
    const ii=rows.findIndex(r=>/^Issues, risks/i.test(T(r[0]))), li=rows.findIndex(r=>/^Look-ahead/i.test(T(r[0])));
    if(ii>=0)P.issues=rows.slice(ii+1,li>ii?li:rows.length).map(r=>r.map(T).filter(Boolean).join(" ")).filter(Boolean).join("\n");
    const LK={"Planned activity / rows:":"planned","Material deliveries due:":"deliveries","Tests and inspections planned:":"tests"};
    if(li>=0)rows.slice(li+1).forEach(r=>{const k=LK[T(r[0])];if(k)P.look[k]=r.slice(1).map(T).filter(Boolean).join(" ")});
    return P.sections.some(s=>s.lines.length)?P:null;
  }
  const hi=rows.findIndex(r=>T(r[0])==="SOR"&&r.map(T).includes("Done to date"));if(hi<0)return null;
  const head=rows[hi].map(T), ci=n=>head.indexOf(n);
  const c={item:ci("Line item"),unit:ci("Unit"),qty:ci("Scope qty"),done:ci("Done to date"),comments:ci("Comments")};
  const P={meta:{},sections:[],issues:"",look:{planned:"",deliveries:"",tests:""}};
  const MK={"Project":"project","Contractor":"contractor","Scope basis":"scope","Reporting period":"period","Report date":"reportDate","Prepared by":"preparedBy"};
  rows.slice(0,hi).forEach(r=>{const k=MK[T(r[0])];if(k)P.meta[k]=k==="reportDate"?(iso(r[1])||T(r[1])):T(r[1])});
  let sec=null;const used=new Set();
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i],a=T(r[0]),b=T(r[c.item]);
    if(/^Overall progress|^Issues, risks/i.test(a))break;
    if(!a&&!b)continue;
    if(a&&!b){sec={name:a,lines:[]};P.sections.push(sec);continue}
    if(!sec){sec={name:"Line items",lines:[]};P.sections.push(sec)}
    let id="L"+(a||i);while(used.has(id))id+="_";used.add(id);
    sec.lines.push({id,sor:a,item:b,unit:T(r[c.unit]),qty:T(r[c.qty]),done:T(r[c.done]),comments:c.comments>=0?T(r[c.comments]):""});
  }
  const ii=rows.findIndex(r=>/^Issues, risks/i.test(T(r[0]))), li=rows.findIndex(r=>/^Look-ahead/i.test(T(r[0])));
  if(ii>=0)P.issues=rows.slice(ii+1,li>ii?li:rows.length).map(r=>r.map(T).filter(Boolean).join(" ")).filter(Boolean).join("\n");
  const LK={"Planned activity / rows:":"planned","Material deliveries due:":"deliveries","Tests and inspections planned:":"tests"};
  if(li>=0)rows.slice(li+1).forEach(r=>{const k=LK[T(r[0])];if(k)P.look[k]=r.slice(1).map(T).filter(Boolean).join(" ")});
  return P.sections.some(s=>s.lines.length)?P:null;
}
async function importXlsx(file){
  if(!window.XLSX||readOnly)return;
  let wbk;try{wbk=XLSX.read(await file.arrayBuffer(),{type:"array"})}catch(e){toast("That file could not be read. Choose an .xlsx file.");return}
  const byRef=new Map();items.forEach(i=>{if(i.ref)byRef.set(i.kind+"|"+i.ref,i)});
  let added=0,updated=0,n=0;const out=[];const base=Date.now();
  for(const kind of Object.keys(XL)){
    const ws=wbk.Sheets[XL[kind].sheet];if(!ws)continue;
    const map=Object.assign({},XL[kind].alias||{},XL[kind].map), titleHeads=Object.keys(map).filter(h=>map[h]==="title"||(kind==="look"&&(map[h]==="area"||map[h]==="name")));

    const head=rows[hi].map(x=>String(x).trim());

      const it=ex?{...ex}:{id:newId(),kind,createdAt:base+(n++)};
      S.fields.forEach(f=>{if(f.t==="pkg")return;const v=o[f.k];it[f.k]=DATEK.has(f.k)?iso(v):String(v==null?"":v).trim()});
      if(kind==="look"){withNames(it,[it.name||""]);
        if(!it.date){const leg={...it};
          if(o.week){leg.week=mondayOf(iso(o.week)||String(o.week));DAYK.forEach(k=>{leg[k]=String(o[k]==null?"":o[k]).trim()})}
          else lookFromRange(leg,iso(o.from),iso(o.to),String(o.title||"").trim());

          continue}}
      normItem(it);const sf=S.fields.find(f=>f.k==="status");if(sf&&!sf.o.includes(it.status))it.status=sf.o[0];
      it.pkg=pk;
      it.ref=ex?ex.ref:(fref||nextRef(kind,pk,it.id));
      if(o.closedOn)it.closedOn=iso(o.closedOn);
      if(kind==="action"&&/^closed$/i.test(String(o.status||"").trim())&&!it.closedOn)it.closedOn=today();
      if(isClosed(it)&&!it.closedOn)it.closedOn=today();
      if(!isClosed(it))delete it.closedOn;
      it.updatedAt=Date.now();
      items.set(it.id,it);byRef.set(kind+"|"+it.ref,it);out.push(it);
      ex?updated++:added++;
    }
  }
  const progDoneFor=[];

  if(progDone){const n=progDoneFor.map(pkgLabel);msg.push((n.length>1?n.slice(0,-1).join(", ")+" and "+n[n.length-1]:n[0])+" progress imported.")}

  const sws=XLSX.utils.aoa_to_sheet([[projectName],["Exported "+fmt(today())],[]].concat(sum));
  sws["!cols"]=[{wch:16}].concat(Array(9).fill({wch:14}));
  XLSX.utils.book_append_sheet(wbk,sws,"Dashboard");
  const dt=s=>s?new Date(s+"T00:00:00"):"";
  for(const kind of Object.keys(XL)){
    const m=XL[kind].map, heads=Object.keys(m), keys=heads.map(h=>m[h]);
    const list=all(kind).sort(kind==="event"?(x,y)=>(x.date||"9999").localeCompare(y.date||"9999")||(x.createdAt||0)-(y.createdAt||0):(x,y)=>(x.createdAt||0)-(y.createdAt||0));
    const ex=kind==="delay"?"Slip (days)":kind==="todo"?"Overdue":null;
    const rows=[ex?heads.concat(ex):heads].concat(list.map(i=>{const r=keys.map(k=>DATEK.has(k)?dt(i[k]):(k==="pkg"&&i.pkg==="ALL"?"All":(kind==="action"&&k==="status"?actStatus(i):(i[k]||""))));
      return ex?r.concat(kind==="delay"?(slip(i)==null?"":slip(i)):(overdue(i)?"Overdue":"")):r}));
    const ws=XLSX.utils.aoa_to_sheet(rows,{dateNF:"dd-mmm-yy"});
    ws["!cols"]=rows[0].map(h=>({wch:/description|^Action$|^Task$|plan|comments|Notes/i.test(h)?42:14}));
    ws["!autofilter"]={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(rows.length-1,1),c:rows[0].length-1}})};
    XLSX.utils.book_append_sheet(wbk,ws,XL[kind].sheet);
  }
  PKGS.forEach(pk=>{
    const P=getProg(pk.id);if(!P)return;
    const aoa=[[(P.meta.project?P.meta.project.split(" – ")[0]:pk.id)+" – Mechanical Progress Report"],[]];
    PMETA.forEach(([k,l])=>aoa.push([l,k==="reportDate"&&P.meta[k]?new Date(iso(P.meta[k])+"T00:00:00"):(P.meta[k]||"")]));
    const pm=isPm(P), pcCol=pm?2:5, pctCells=[], fracCells=[];
    aoa.push([],["Progress by line item"],pm?["Ref","Item","% complete","Comments"]:["SOR","Line item","Unit","Scope qty","Done to date","% complete","Comments"]);
    const frac=v=>{const n=num(v);return n==null?0:Math.min(Math.max(n,0),100)/100};
    P.sections.forEach(sec=>{aoa.push([(pm&&sec.sor?sec.sor+" ":"")+sec.name]);sec.lines.forEach(l=>{const pc=linePct(l);
      if(pm){aoa.push([l.sor,l.item,pc,l.comments]);
        if(!l.single){pctCells.push(aoa.length-1);aoa.push(["a","Material",frac(l.mat)]);pctCells.push(aoa.length-1);aoa.push(["b","Labour",frac(l.lab)])}}
      else aoa.push([num(l.sor)!=null?num(l.sor):l.sor,l.item,l.unit,num(l.qty)!=null?num(l.qty):l.qty,num(l.done)!=null?num(l.done):l.done,pc==null?"":pc,l.comments]);
      if(pc!=null)pctCells.push(aoa.length-1)})});
    const ovr=[overLabel(P)];while(ovr.length<pcCol)ovr.push("");ovr.push(avgPct(allLines(P)).avg);aoa.push(ovr);pctCells.push(aoa.length-1);
    aoa.push([],["Issues, risks & scope clarifications"],[P.issues||""],[],["Look-ahead – next period"]);
    PLOOK.forEach(([k,l])=>aoa.push([l+":",(P.look||{})[k]||""]));
    const ws=XLSX.utils.aoa_to_sheet(aoa,{dateNF:"dd/mm/yyyy"});
    pctCells.forEach(r=>{const a=XLSX.utils.encode_cell({r,c:pcCol});if(ws[a]&&typeof ws[a].v==="number")ws[a].z="0%"});
    fracCells.forEach(r=>[2,3].forEach(c=>{const a=XLSX.utils.encode_cell({r,c});if(ws[a]&&typeof ws[a].v==="number")ws[a].z="0%"}));
    ws["!cols"]=pm?[{wch:10},{wch:64},{wch:12},{wch:40}]:[{wch:16},{wch:40},{wch:8},{wch:11},{wch:13},{wch:11},{wch:30}];
    XLSX.utils.book_append_sheet(wbk,ws,pk.id+" Progress");
  });
  const buf=XLSX.write(wbk,{bookType:"xlsx",type:"array"});
  const name=(projectName||"tracker").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-")+"-"+today()+".xlsx";
  try{await downloads.save({filename:name,data:buf});toast("Exported.")}
  catch(e){if(e&&e.code&&e.code!=="declined"&&e.code!=="cancelled")toast("Export did not complete.")}
}
$("importBtn").addEventListener("click",()=>$("importFile").click());
$("logoBtn").addEventListener("click",()=>{if(!readOnly)$("logoFile").click()});
$("logoFile").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{projectLogo=await readLogo(f);renderLogo();await saveMeta();toast("Logo added.")}
  catch(err){toast("That image could not be used. Try a PNG, JPG or SVG file.")}
});
$("importFile").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(f)importXlsx(f)});
$("xlsxBtn").addEventListener("click",exportXlsx);

/* ---------- toast ---------- */
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2600)}

/* ---------- other events ---------- */
$("lanes").addEventListener("click",e=>{const b=e.target.closest(".lane");if(!b)return;
  pkgFilter=pkgFilter===b.dataset.pkg?"ALL":b.dataset.pkg;if(pkgFilter!=="ALL"){newPkg=pkgFilter;progPkg=pkgFilter;lookPkg=pkgFilter;rfiPkg=pkgFilter;laSel.clear()}render()});
$("tabs").addEventListener("click",e=>{const rp=e.target.closest("[data-rfipkg]");if(rp){rfiPkg=rp.dataset.rfipkg;closeFilter();tableKey="";render();return}
  const pk=e.target.closest("[data-lapkg]");if(!pk)return;lookPkg=pk.dataset.lapkg;laSel.clear();closeFilter();tableKey="";render()});
$("sidenav").addEventListener("click",e=>{if(e.target.closest("#navToggle")){navCollapsed=!navCollapsed;try{localStorage.setItem("pmt-nav",navCollapsed?"1":"0")}catch(x){}renderTabs();$("navToggle").focus();return}const b=e.target.closest(".tab");if(!b)return;enterView(b.dataset.k);render();$("tablebox").scrollTop=0;$("progbox").scrollTop=0});
$("sidenav").addEventListener("keydown",e=>{
  const nx={ArrowDown:1,ArrowRight:1,ArrowUp:-1,ArrowLeft:-1}[e.key];if(!nx)return;e.preventDefault();
  const ks=["dash"].concat(Object.keys(SCHEMA),"progress");let i=ks.indexOf(view)+nx;
  enterView(ks[(i+ks.length)%ks.length]);render();document.querySelector(`#sidenav .tab[data-k="${view}"]`).focus();
});
$("q").addEventListener("input",e=>{q=e.target.value;renderFilterline();syncTable()});
$("hideClosed").addEventListener("change",e=>{hideClosed=e.target.checked;syncTable()});
$("exportBtn").addEventListener("click",exportCsv);
$("filterline").addEventListener("click",e=>{const c=e.target.dataset.clear;if(c==="cols"){delete colFilters[view];closeFilter()}if(c==="pkg")pkgFilter="ALL";if(c==="q"){q="";$("q").value=""}if(c)render()});
const pn=$("pname");
pn.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();pn.blur()}});
pn.addEventListener("blur",()=>{const n=pn.textContent.trim()||"Project tracker";pn.textContent=n;if(n!==projectName&&!readOnly)saveName(n);document.title=n});

/* ---------- refresh ---------- */
$("refreshBtn").addEventListener("click",async()=>{
  const b=$("refreshBtn");b.disabled=true;b.classList.add("spin");b.querySelector("span").textContent="Refreshing…";
  const a=document.activeElement;if(a&&a!==document.body&&a.blur)a.blur();   // saves any cell still being typed in
  try{if(navigator.serviceWorker){const r=await navigator.serviceWorker.getRegistration();if(r)await r.update()}}catch(e){}
  setTimeout(()=>location.reload(),mode==="db"?700:200);
});

/* ---------- theme switch ---------- */
$("themeSw").addEventListener("click",()=>applyTheme(curTheme()==="dark"?"light":"dark",true));

/* ---------- start ---------- */
function tryRepoLogo(files){
  if(projectLogo||!files.length)return;
  const im=new Image();im.onload=()=>{repoLogo=files[0];renderLogo()};im.onerror=()=>tryRepoLogo(files.slice(1));im.src=files[0];
}
loadLocal();
if(!(window.claude&&typeof window.claude.use==="function")){
  downloads={save:async({filename,data})=>{
    const ext=(filename.match(/\.(\w+)$/)||[])[1]||"";
    const type={csv:"text/csv",pdf:"application/pdf",xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}[ext.toLowerCase()]||"application/octet-stream";
    const blob=new Blob([data],{type});
    try{const f=new File([blob],filename,{type});
      if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return{status:"saved"}}}
    catch(e){if(e&&e.name==="AbortError")throw{code:"cancelled"}}
    const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return{status:"saved"};
  }};
  if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
render();applyTheme(curTheme(),false);
if(!(window.claude&&typeof window.claude.use==="function"))tryRepoLogo(["logo.svg","logo.png"]);
(async()=>{
  const c=window.claude;if(!c||typeof c.use!=="function")return;
  c.use("downloads").then(d=>{downloads=d;render()}).catch(()=>{});
  let d;try{d=await c.use("db")}catch(e){d=null}
  if(!d)return;
  db=d;mode="db";
  const pending=[...items.values()];let migrated=false;
  db.collection("items").onSnapshot(snap=>{
    if(!migrated&&!snap.metadata.fromCache){
      migrated=true;
      if(snap.empty&&pending.length){
        (async()=>{for(const it of pending){try{await db.collection("items").doc(it.id).set(it)}catch(e){failed(e);return}}
          try{localStorage.removeItem(LS)}catch(e){}})();
        return;
      }
    }
    if(snap.empty&&!migrated)return;
    items=new Map();snap.docs.forEach(x=>{const v=x.data();if(v)items.set(x.id,normItem({...v,id:x.id}))});migrateLookItems(true);
    render();
  },()=>{mode="local";db=null;toast("Live saving stopped. Changes now save on this device.");render()});
  const pendingProg=clone(progress);let pmig=false;
  db.collection("progress").onSnapshot(snap=>{
    if(!pmig&&!snap.metadata.fromCache){
      pmig=true;
      if(snap.empty&&Object.keys(pendingProg).length){
        (async()=>{for(const k of Object.keys(pendingProg)){try{await db.doc("progress/"+k).set(pendingProg[k])}catch(e){failed(e);return}}})();
        return;
      }
    }
    if(snap.empty&&!pmig)return;
    const np={};snap.docs.forEach(x=>{const v=x.data();if(v&&v.sections)np[x.id]=v});
    // don't let an older copy from the server overwrite figures still being typed
    {const pb=$("progbox"),a=document.activeElement,typing=a&&pb.contains(a)&&a.classList.contains("cell");
     if((typing||progSaveT)&&progress[progPkg])np[progPkg]=progress[progPkg]}
    progress=np;renderLanes();if(view==="progress")syncProg();
  },()=>{});
  db.doc("meta/project").onSnapshot(s=>{if(s.exists){const v=s.data()||{};if(v.name){projectName=v.name;renderName()}projectLogo=v.logo||projectLogo;renderLogo()}},()=>{});
  render();
})();
})();
</script>
