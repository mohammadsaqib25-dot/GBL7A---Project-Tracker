<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AirconMech project tracker</title>
<meta name="theme-color" content="#832F84">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F2F6; --surface:#FFFFFF; --ink:#22152A; --muted:#66576B; --line:#DACCDA; --soft:#EEE6EE;
  --brand:#832F84; --gold:#FBB900; --accent:#832F84;
  --fsa:#832F84; --myd:#A87C00; --ml:#3A6788; --late:#B3352E; --ok:#2C7646; --warn:#A86400; --focus:#832F84;
  --redbg:#F8DFDC; --ambg:#FDEFC8; --okbg:#DDEFE3; --newbg:#FAF7FA; --secbg:#EFE3F0; --inbg:#FFF8DC;
  color-scheme:light;
  box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#161017; --surface:#201722; --ink:#F0E9F0; --muted:#AE9FB0; --line:#412E43; --soft:#2E2131;
    --accent:#E2A8E3;
    --fsa:#DDA0DF; --myd:#FBB900; --ml:#80B2D6; --late:#E46D64; --ok:#62BD80; --warn:#E19A3A; --focus:#E2A8E3;
    --redbg:#4A2523; --ambg:#47371A; --okbg:#1E3A29; --newbg:#1A131C; --secbg:#2F2032; --inbg:#3A3220;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#161017; --surface:#201722; --ink:#F0E9F0; --muted:#AE9FB0; --line:#412E43; --soft:#2E2131;
  --accent:#E2A8E3;
  --fsa:#DDA0DF; --myd:#FBB900; --ml:#80B2D6; --late:#E46D64; --ok:#62BD80; --warn:#E19A3A; --focus:#E2A8E3;
  --redbg:#4A2523; --ambg:#47371A; --okbg:#1E3A29; --newbg:#1A131C; --secbg:#2F2032; --inbg:#3A3220;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--brand)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.45;
  font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto;padding:20px 20px 48px;background:var(--paper)}
body>.wrap{min-height:calc(100vh - 90px)}

/* Brand bar */
.brandbar{background:var(--brand);color:#fff;border-bottom:4px solid var(--gold);padding-top:env(safe-area-inset-top,0px)}
.brandin{max-width:1440px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.logo{background:none;border:0;border-radius:4px;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.logo img{height:72px;width:auto;max-width:260px;display:block}
.logo .ph{color:var(--brand);font-size:.78rem;font-weight:700;line-height:1.15;text-align:center;border:1.5px dashed var(--brand);
  border-radius:4px;padding:6px 8px}
.logo:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.titles{min-width:0;flex:1 1 260px}
.name{font-stretch:72%;font-weight:800;font-size:clamp(1.5rem,3.4vw,2.2rem);line-height:1.05;letter-spacing:-.005em;margin:0;
  padding:2px 4px;margin-left:-4px;border-radius:4px;min-width:6ch;color:#fff}
.name:hover{background:rgba(255,255,255,.12)}
.name:focus-visible{outline-color:var(--gold)}
.sub{color:rgba(255,255,255,.78);font-size:.84rem;margin-top:4px}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6);display:inline-block}
.sync.live i{background:var(--gold)}
.topbtns{display:flex;flex-wrap:wrap;gap:8px}
.brandbar .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.brandbar .btn:hover{border-color:var(--gold);color:var(--gold)}
.brandbar .btn:focus-visible{outline-color:var(--gold)}

/* Package lanes */
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:22px}
.lane{--c:var(--fsa);position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-top:7px solid var(--c);border-radius:3px 3px 6px 6px;padding:12px 14px 12px;cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease}
.lane[data-pkg="MYD"]{--c:var(--myd)} .lane[data-pkg="ML"]{--c:var(--ml)}
.lane:hover{border-color:var(--c)}
.lane[aria-pressed="true"]{box-shadow:0 0 0 2px var(--c) inset;transform:translateY(-2px)}
.lane .code{font-stretch:62%;font-weight:800;font-size:3rem;line-height:.9;color:var(--c);letter-spacing:-.01em}
.lane .pk{font-size:.82rem;color:var(--muted);margin:2px 0 10px}
.lane dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:.88rem}
.lane dt{color:var(--muted)} .lane dd{margin:0;font-weight:650;text-align:right}
.lane dd.bad{color:var(--late)}
.lane .hint{position:absolute;top:10px;right:12px;font-size:.75rem;color:var(--muted)}

/* Toolbar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.tabs{display:flex;gap:2px;margin-right:auto}
.tab{background:none;border:0;padding:10px 12px 9px;cursor:pointer;color:var(--muted);font-weight:600;
  border-bottom:3px solid transparent;margin-bottom:-1px;font-stretch:88%;font-size:1.05rem}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-weight:500;color:var(--muted);margin-left:4px;font-size:.9rem}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-bottom:8px}
.search{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;width:220px;max-width:100%}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);cursor:pointer;user-select:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.filterline{font-size:.84rem;color:var(--muted);margin:0 0 10px;min-height:1.2em}
.filterline button{background:none;border:0;padding:0;color:var(--focus);cursor:pointer;text-decoration:underline}

/* Spreadsheet grid */
.tablebox{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;
  max-height:calc(100vh - 230px);min-height:260px;-webkit-overflow-scrolling:touch}
table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed}
.grid th,.grid td{border-right:1px solid var(--soft);border-bottom:1px solid var(--soft);padding:0;vertical-align:top;background:var(--surface)}
.grid th{position:sticky;top:0;z-index:2;background:var(--paper);font-size:.78rem;font-weight:650;color:var(--muted);
  text-align:left;padding:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--line)}
.grid th:first-child,.grid td:first-child{position:sticky;left:0;z-index:1;border-right:1px solid var(--line)}
.grid th:first-child{z-index:3}
.grid td.ro{padding:8px;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid td:first-child{font-weight:650}
.cell{display:block;width:100%;border:0;background:transparent;padding:8px;font-size:.9rem;line-height:1.35;
  border-radius:0;min-height:36px;margin:0;color:var(--ink)}
textarea.cell{resize:none;overflow:hidden;font-family:inherit;height:36px}
.cell:focus{outline:2px solid var(--focus);outline-offset:-2px;background:var(--surface);position:relative;z-index:1}
.cell::placeholder{color:var(--muted);opacity:1;font-style:italic}
select.cell{appearance:none;-webkit-appearance:none;padding-right:22px;cursor:pointer;text-overflow:ellipsis;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 13px) 15px,calc(100% - 9px) 15px;background-size:4px 4px;background-repeat:no-repeat}
select.cell:focus{background-color:var(--surface)}
input[type="date"].cell{min-width:0;font-size:.86rem}
.cell:disabled{cursor:default;opacity:1;-webkit-text-fill-color:var(--ink)}
td.pk{--c:var(--fsa);box-shadow:inset 4px 0 0 var(--c)}
td.pk.MYD{--c:var(--myd)} td.pk.ML{--c:var(--ml)}
td.pk .cell{font-weight:800;font-stretch:72%;font-size:1rem;color:var(--c);padding-left:12px}
td[data-v="High"],td[data-v="Critical"]{background:var(--redbg)}
td[data-v="Medium"],td[data-v="Mitigating"],td[data-v="In progress"],td[data-v="Doing"]{background:var(--ambg)}
td[data-v="Resolved"],td[data-v="Closed"],td[data-v="Done"]{background:var(--okbg)}
td.od .cell{color:var(--late);font-weight:650}
.grid tr.closed .cell,.grid tr.closed td.ro{color:var(--muted)}
.grid tr.closed td:first-child{text-decoration:line-through;text-decoration-color:var(--line)}
.grid tr.newrow td{background:var(--newbg)}
.grid tr.newrow td:first-child{color:var(--muted);font-weight:400}
.slip{font-weight:700} .slip.pos{color:var(--late)} .slip.neg{color:var(--ok)}
.late{color:var(--late);font-weight:650}
td.dc{text-align:center}
.del{border:0;background:none;color:var(--muted);font-size:1.15rem;line-height:1;cursor:pointer;padding:8px 6px;opacity:0;border-radius:4px}
.grid tr:hover .del,.grid tr:focus-within .del,.del:focus-visible{opacity:1}
.del:hover{color:var(--late)}
@media (hover:none){.del{opacity:.55}}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}

/* Progress tracker */
.ptop{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:2px 0 14px}
.pkpills{display:flex;gap:6px}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{background:#6C2470;border-color:#6C2470;color:#fff}
.btn.primary:disabled{opacity:.6;cursor:wait}
.pp{--c:var(--fsa);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 18px;font-weight:800;
  font-stretch:72%;font-size:1.05rem;color:var(--muted);cursor:pointer}
.pp.MYD{--c:var(--myd)} .pp.ML{--c:var(--ml)}
.pp:hover{border-color:var(--c);color:var(--c)}
.pp[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--surface)}
.pempty{border:1.5px dashed var(--line);border-radius:8px;padding:56px 20px;text-align:center;color:var(--muted);background:var(--surface)}
.pempty .big{font-stretch:72%;font-weight:800;font-size:1.7rem;color:var(--ink);margin:0 0 6px}
.pempty p{margin:0}
.pmeta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:6px;background:var(--surface);
  overflow:hidden;margin-bottom:14px}
.mf{display:flex;flex-direction:column;border-right:1px solid var(--soft);border-bottom:1px solid var(--soft);padding-top:7px;margin-right:-1px;margin-bottom:-1px}
.mf>span{font-size:.75rem;color:var(--muted);font-weight:650;padding:0 8px}
.mf .cell{min-height:32px;padding-top:4px}
.overall{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px 24px;background:var(--brand);color:#fff;border-radius:6px;
  padding:14px 20px;margin-bottom:14px;border-bottom:4px solid var(--gold)}
.olabel{font-size:.84rem;opacity:.9;font-weight:600}
.onum{font-stretch:66%;font-weight:800;font-size:2.8rem;line-height:1;color:var(--gold);margin:2px 0}
.osub{font-size:.78rem;opacity:.78}
.obar{height:14px;background:rgba(255,255,255,.2);border-radius:7px;overflow:hidden}
.obar i{display:block;height:100%;background:var(--gold);border-radius:7px;transition:width .35s ease}
.grid tr.sec td{background:var(--secbg);font-weight:750;padding:7px 8px;font-size:.88rem;color:var(--ink)}
.grid tr.sec td.secp{text-align:right;font-weight:700}
.grid td.done{background:var(--inbg)}
.grid tr.over td.done{box-shadow:inset 0 0 0 2px var(--warn)}
.cell.num{text-align:right;font-variant-numeric:tabular-nums}
.pcw{display:flex;align-items:center;gap:8px;padding:8px}
.pcw .pbar{flex:1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.pcw .pbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.pcw b{font-weight:700;font-size:.86rem;min-width:3.2em;text-align:right}
tr.full .pcw .pbar i{background:var(--ok)} tr.full .pcw b{color:var(--ok)}
.na{color:var(--muted);font-size:.84rem;padding:8px;display:block}
.pnotes h3{font-size:1.15rem;font-stretch:76%;font-weight:800;margin:22px 0 8px;color:var(--accent)}
.pnotes .box{border:1px solid var(--line);border-radius:6px;background:var(--surface);min-height:96px}
.look{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.look label>span{display:block;font-size:.8rem;color:var(--muted);font-weight:650;margin-bottom:4px}
.look .box{min-height:72px}
@media (max-width:760px){.pmeta,.look{grid-template-columns:1fr}.overall{grid-template-columns:1fr}.onum{font-size:2.3rem}}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:6px;font-size:.9rem;opacity:0;pointer-events:none;
  transition:opacity .2s;max-width:calc(100vw - 32px);z-index:10}
.toast.on{opacity:1}

@media (max-width:760px){
  .wrap{padding:14px 10px 40px}
  .brandin{padding:12px 12px}
  .logo img{height:54px;max-width:200px}
  .lanes{grid-template-columns:1fr;gap:8px}
  .lane{display:grid;grid-template-columns:auto 1fr;column-gap:16px;align-items:start}
  .lane .code{font-size:2.4rem;grid-row:span 2}
  .lane .pk{margin:0 0 6px}
  .lane dl{grid-column:2}
  .search{width:100%}
  .tools{width:100%}
  .tablebox{max-height:75vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="brandbar">
  <div class="brandin">
    <button class="logo" id="logoBtn" title="AirconMech. Click to use a different logo" aria-label="AirconMech logo, click to change"><img id="logoImg" alt="AirconMech" hidden><span class="ph" id="logoPh">Add<br>logo</span></button>
    <input type="file" id="logoFile" accept="image/png,image/jpeg,image/svg+xml,image/webp,image/gif" hidden>
    <div class="titles">
      <h1 class="name" id="pname" contenteditable="true" spellcheck="false" aria-label="Project name, click to edit">Project tracker</h1>
      <div class="sub"><span class="sync" id="sync"><i></i><span>Saved on this device</span></span></div>
    </div>
    <div class="topbtns">
      <button class="btn" id="importBtn" hidden>Import spreadsheet</button><input type="file" id="importFile" accept=".xlsx,.xls" hidden><button class="btn" id="xlsxBtn" hidden>Export to Excel</button><button class="btn" id="exportBtn" hidden>Export tab to CSV</button>
    </div>
  </div>
</header>
<div class="wrap">
  <section class="lanes" id="lanes" aria-label="Packages"></section>

  <div class="bar">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="tools" id="tools">
      <input class="search" id="q" type="search" placeholder="Search ref, text or owner" aria-label="Search">
      <label class="chk"><input type="checkbox" id="hideClosed"> Hide closed</label>
    </div>
  </div>
  <p class="filterline" id="filterline"></p>
  <div class="tablebox" id="tablebox"></div>
  <div id="progbox" hidden></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="xlsx.full.min.js"></script>
<script src="jspdf.umd.min.js"></script>
<script>
(function(){
"use strict";
const PKGS=[
  {id:"FSA",sub:"Package 1"},
  {id:"MYD",sub:"Package 2"},
  {id:"ML",sub:"Package 3, Machine Learning"}
];
const SCHEMA={
  delay:{tab:"Delays",noun:"delay",letter:"D",closed:"Resolved",fields:[
    {k:"pkg",t:"pkg"},{k:"title",t:"text"},
    {k:"cause",t:"select",o:["Design / information","Procurement / supply","Client change","Site access / interface","Labour / resources","Third party / utility","Commissioning / testing","Other"]},
    {k:"impact",t:"select",o:["Low","Medium","High","Critical"]},
    {k:"identified",t:"date"},{k:"responsible",t:"text"},{k:"original",t:"date"},{k:"revised",t:"date"},
    {k:"status",t:"select",o:["Open","Mitigating","Resolved"]},
    {k:"eot",t:"select",o:["Not required","To be assessed","Submitted","Granted","Rejected"]},
    {k:"mitigation",t:"area"},{k:"comments",t:"area"}
  ]},
  action:{tab:"Actions",noun:"action",letter:"A",closed:"Closed",fields:[
    {k:"pkg",t:"pkg"},{k:"title",t:"text"},{k:"owner",t:"text"},
    {k:"source",t:"select",o:["Progress meeting","Design review","Site walk","Client request","Email / RFI","Other"]},
    {k:"raised",t:"date"},{k:"due",t:"date"},
    {k:"priority",t:"select",o:["Low","Medium","High"]},
    {k:"status",t:"select",o:["Open","In progress","Closed"]},
    {k:"notes",t:"area"}
  ]},
  todo:{tab:"To-do",noun:"task",letter:"T",closed:"Done",fields:[
    {k:"pkg",t:"pkg"},{k:"title",t:"text"},{k:"owner",t:"text"},{k:"due",t:"date"},
    {k:"priority",t:"select",o:["Low","Medium","High"]},
    {k:"status",t:"select",o:["To do","Doing","Done"]},
    {k:"notes",t:"area"}
  ]}
};

function linePct(l){const qy=num(l.qty);if(qy==null||qy<=0)return null;const d=num(l.done);return d==null?0:Math.min(Math.max(d,0)/qy,1)}

function failed(e){
  const c=e&&e.code;
  if(c==="invalid_argument"){readOnly=true;toast("You can view this tracker but not change it.");render()}
  else if(c==="quota_exceeded")toast("The tracker is full. Delete old closed items to make room.");

}

function renderLogo(){
  const src=projectLogo||repoLogo||DEFAULT_LOGO, img=$("logoImg");
  if(src){if(img.getAttribute("src")!==src)img.src=src;img.hidden=false;$("logoPh").hidden=true}
  else{img.hidden=true;img.removeAttribute("src");$("logoPh").hidden=false}
  $("logoBtn").disabled=readOnly&&!src;
}
function readLogo(file){return new Promise((res,rej)=>{
  const fr=new FileReader();fr.onerror=rej;
  fr.onload=()=>{const url=fr.result;
    if(/svg/i.test(file.type)&&url.length<180000)return res(url);
    const im=new Image();im.onerror=rej;
    im.onload=()=>{const nh=im.naturalHeight||160,nw=im.naturalWidth||160;let h=Math.min(160,nh),w=Math.round(nw*h/nh);
      if(w>800){w=800;h=Math.round(nh*w/nw)}
      const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(im,0,0,w,h);res(cv.toDataURL("image/png"))};
    im.src=url};
  fr.readAsDataURL(file)})}
function nextRef(kind,pkg,exceptId){
  const pre=pkg+"-"+SCHEMA[kind].letter;let max=0;
  items.forEach(i=>{if(i.id!==exceptId&&i.ref&&i.ref.indexOf(pre)===0){const n=parseInt(i.ref.slice(pre.length),10);if(n>max)max=n}});
  return pre+String(max+1).padStart(3,"0");
}

    const d=all("delay",p.id).filter(i=>!isClosed(i));
    const a=all("action",p.id).filter(i=>!isClosed(i));
    const od=a.filter(overdue).length;
    const tl=all("todo",p.id).filter(i=>!isClosed(i));const t=tl.length;const tod=tl.filter(overdue).length;
    const eot=all("delay",p.id).filter(i=>i.eot==="To be assessed"||i.eot==="Submitted").length;
    const longest=d.reduce((m,i)=>{const s=slip(i);return s!=null&&s>m?s:m},0);
    const crit=d.filter(i=>i.impact==="High"||i.impact==="Critical").length;
    return `<button class="lane" data-pkg="${p.id}" aria-pressed="${pkgFilter===p.id}">
      ${pkgFilter===p.id?'<span class="hint">Showing only this package</span>':''}
      <div class="code">${p.id}</div><div class="pk">${esc(p.sub)}</div>
      <dl>
        <dt>Open delays</dt><dd class="${crit?'bad':''}">${d.length}${crit?` (${crit} high)`:''}</dd>
        <dt>Longest slip</dt><dd class="${longest>0?'bad':''}">${longest>0?longest+(longest===1?" day":" days"):"None"}</dd>
        <dt>EOT claims pending</dt><dd>${eot}</dd>
        <dt>Open actions</dt><dd>${a.length}</dd>
        <dt>Overdue actions</dt><dd class="${od?'bad':''}">${od}</dd>
        <dt>To-dos left</dt><dd class="${tod?'bad':''}">${t}${tod?` (${tod} overdue)`:''}</dd>
        <dt>Progress</dt><dd>${progTxt(p.id)}</dd>
      </dl></button>`}).join("");
}

/* ---------- render: grid ---------- */
function filtered(){
  const s=q.trim().toLowerCase();
  let list=all(view,pkgFilter);
  if(hideClosed)list=list.filter(i=>!isClosed(i));
  if(s)list=list.filter(i=>[i.ref,i.title,i.owner,i.responsible,i.notes,i.mitigation,i.comments,i.cause,i.source].some(v=>v&&String(v).toLowerCase().includes(s)));
  return list.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)||String(a.ref).localeCompare(String(b.ref)));
}
function grow(el){el.style.height="auto";el.style.height=Math.max(36,el.scrollHeight)+"px"}
function delCell(i){return readOnly?"<td></td>":`<td class="dc"><button class="del" aria-label="Delete ${esc(i.ref)}" title="Delete row">×</button></td>`}
function rowHtml(i){
  const isNew=!i, dis=readOnly?" disabled":"";
  const tds=GRID[view].map(c=>{
    if(c.t==="ro")return isNew?`<td class="ro">${c.k==="ref"?"New":""}</td>`:`<td class="ro">${c.calc?c.calc(i):esc(i[c.k]||"")}</td>`;
    const v=isNew?(c.t==="pkg"?newPkg:""):(i[c.k]==null?"":String(i[c.k]));
    const a=`class="cell" data-k="${c.k}" aria-label="${esc(c.l)}"${dis}`;
    let inner,cls="",dv="";
    if(c.t==="pkg"){cls="pk "+v;inner=`<select ${a}>${PKGS.map(p=>`<option${p.id===v?" selected":""}>${p.id}</option>`).join("")}</select>`}
    else if(c.t==="select"){

      if(c.vcol)dv=` data-v="${esc(v)}"`;
    }

function captureFocus(root){
  root=root||$("tablebox");const a=document.activeElement;
  if(!a||!a.classList||!a.classList.contains("cell")||!root.contains(a))return null;
  let ss=null,se=null;try{ss=a.selectionStart;se=a.selectionEnd}catch(e){}
  return {id:a.closest("[data-id]").dataset.id,k:a.dataset.k,val:a.value,ss,se};
}
function restoreFocus(f,root){
  root=root||$("tablebox");
  if(!f)return;const tr=root.querySelector(`[data-id="${f.id}"]`);if(!tr)return;
  const el=tr.querySelector(`.cell[data-k="${f.k}"]`);if(!el)return;
  if(el.value!==f.val){el.value=f.val;if(el.tagName==="TEXTAREA")grow(el)}
  el.focus({preventScroll:true});try{if(f.ss!=null)el.setSelectionRange(f.ss,f.se)}catch(e){}
}
function fullTable(list){

    <thead><tr>${cols.map(c=>`<th scope="col" title="${esc(c.l)}">${esc(c.l)}</th>`).join("")}<th aria-label="Delete row"></th></tr></thead>

function pcHtml(pc){return pc==null?'<span class="na">n/a</span>':`<div class="pcw"><div class="pbar"><i style="width:${(pc*100).toFixed(1)}%"></i></div><b>${pct0(pc)}</b></div>`}
function progKey(P){return progPkg+"|"+readOnly+"|"+!!downloads+"|"+(P?JSON.stringify(P):"none")}
function syncProg(){
  const P=getProg(progPkg), k=progKey(P), box=$("progbox");

function patchProg(P){

    sec.lines.forEach(l=>{const tr=box.querySelector(`tr[data-id="${l.id}"]`);if(!tr)return;const pc=linePct(l);

  $("pOverSub").textContent=`Average of ${o.n} quantified line item${o.n===1?"":"s"}`;

function progCommit(el){
  if(readOnly)return;
  const host=el.closest("[data-id]");if(!host)return;
  const id=host.dataset.id,k=el.dataset.k, val=el.type==="date"?el.value:el.value.trim();
  const P=getProg(progPkg);if(!P)return;
  let cur;
  if(id==="meta"){cur=P.meta[k]||"";if(cur===val)return;P.meta[k]=val}
  else if(id==="notes"){P.look=P.look||{};cur=k==="issues"?(P.issues||""):(P.look[k]||"");if(cur===val)return;if(k==="issues")P.issues=val;else P.look[k]=val}
  else{
    const line=allLines(P).find(l=>l.id===id);if(!line)return;cur=line[k]==null?"":String(line[k]);if(cur===val)return;
    if((k==="done"||k==="qty")&&val!==""&&(num(val)==null||num(val)<0)&&!(k==="qty"&&/^tbc$/i.test(val))){
      el.value=cur;toast(k==="done"?"Enter a number for done to date.":"Enter a number or TBC for scope qty.");return}
    line[k]=val;
  }
  progress[progPkg]=P;
  patchProg(P);renderLanes();saveProg(progPkg);
}
function syncTable(){
  if(view==="progress"){$("tablebox").hidden=true;$("progbox").hidden=false;syncProg();return}
  $("tablebox").hidden=false;$("progbox").hidden=true;progRendered.sig=null;
  const list=filtered(), key=[view,pkgFilter,q,hideClosed,readOnly].join("|");
  const tb=$("tablebox").querySelector("tbody");
  const dom=tb?[...tb.children].map(t=>t.dataset.id).filter(x=>x!=="new").join(","):null;
  if(!tb||key!==tableKey||dom!==list.map(i=>i.id).join(",")){tableKey=key;fullTable(list);return}
  list.forEach(i=>{if(rowSig.get(i.id)!==sig(i)){const tr=tb.querySelector(`tr[data-id="${i.id}"]`);if(tr)patchRow(tr,i)}});
}

/* ---------- editing ---------- */
function commit(el){
  if(readOnly)return;
  const tr=el.closest("tr");if(!tr)return;
  const id=tr.dataset.id, k=el.dataset.k;
  const val=(el.tagName==="SELECT"||el.type==="date")?el.value:el.value.trim();
  if(id==="new"){
    if(k==="pkg"){newPkg=val;el.closest("td").className="pk "+val;return}
    if(!val)return;
    const it={id:newId(),kind:view,createdAt:Date.now(),pkg:newPkg,status:opt(view,"status")[0]};
    if(view==="delay"){it.identified=today();it.eot="To be assessed"}
    if(view==="action")it.raised=today();
    it[k]=val;it.ref=nextRef(view,it.pkg,it.id);
    tr.dataset.id=it.id;tr.classList.remove("newrow");
    const t=tr.querySelector('.cell[data-k="title"]');if(t)t.removeAttribute("placeholder");
    const st=tr.querySelector('select[data-k="status"]');if(st&&st.options[0]&&st.options[0].value==="")st.remove(0);
    tr.lastElementChild.outerHTML=delCell(it);
    putItem(it,true);patchRow(tr,it);
    tr.insertAdjacentHTML("afterend",rowHtml(null));
    if(pkgFilter!=="ALL"&&it.pkg!==pkgFilter)toast(`${it.ref} added to ${it.pkg}.`);
    return;
  }
  const old=items.get(id);if(!old)return;
  if((old[k]==null?"":String(old[k]))===val)return;
  const it={...old};it[k]=val;
  if(k==="pkg")it.ref=nextRef(it.kind,val,it.id);
  if(k==="status"){if(isClosed(it)&&!it.closedOn)it.closedOn=today();if(!isClosed(it))delete it.closedOn}
  putItem(it,true);patchRow(tr,it);
}
function moveTo(tr,k){
  if(!tr)return;const el=tr.querySelector(`.cell[data-k="${k}"]`);if(!el)return;
  el.focus();if(el.type==="text"||el.tagName==="TEXTAREA"){const n=el.value.length;try{el.setSelectionRange(n,n)}catch(e){}}
}
const box=$("tablebox");
box.addEventListener("change",e=>{if(e.target.classList&&e.target.classList.contains("cell"))commit(e.target)});
box.addEventListener("input",e=>{if(e.target.tagName==="TEXTAREA")grow(e.target)});
box.addEventListener("keydown",e=>{
  const el=e.target;if(!el.classList||!el.classList.contains("cell"))return;
  const tr=el.closest("tr"),k=el.dataset.k;
  if(e.key==="Escape"){
    const it=items.get(tr.dataset.id);el.value=it?(it[k]==null?"":it[k]):(k==="pkg"?newPkg:"");
    if(el.tagName==="TEXTAREA")grow(el);el.blur();return;
  }
  if(e.key==="Enter"&&!e.shiftKey&&el.tagName!=="SELECT"){e.preventDefault();commit(el);moveTo(tr.nextElementSibling,k);return}
  if(el.type==="text"&&(e.key==="ArrowDown"||e.key==="ArrowUp")){
    e.preventDefault();commit(el);moveTo(e.key==="ArrowDown"?tr.nextElementSibling:tr.previousElementSibling,k);
  }
});
box.addEventListener("click",e=>{
  const b=e.target.closest(".del");if(!b)return;
  const it=items.get(b.closest("tr").dataset.id);if(!it)return;
  if(confirm(`Delete ${it.ref}${it.title?": "+it.title.slice(0,60):""}? This cannot be undone.`)){removeItem(it.id);toast(`${it.ref} deleted.`)}
});

/* ---------- one-page PDF progress report ---------- */
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src})}
async function logoForPdf(){
  const src=projectLogo||repoLogo||DEFAULT_LOGO;
  try{
    const im=await loadImg(src), w=im.naturalWidth||344, h=im.naturalHeight||150;
    if(/^data:image\/(png|jpe?g)/i.test(src))return {data:src,fmt:/^data:image\/jpe?g/i.test(src)?"JPEG":"PNG",w,h};
    const k=Math.min(4,900/w), cv=document.createElement("canvas");cv.width=Math.round(w*k);cv.height=Math.round(h*k);
    cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);return {data:cv.toDataURL("image/png"),fmt:"PNG",w:cv.width,h:cv.height};
  }catch(e){const im=await loadImg(DEFAULT_LOGO);return {data:DEFAULT_LOGO,fmt:"PNG",w:im.naturalWidth,h:im.naturalHeight}}
}
function fmtDMY(v){const d=iso(v)||v;const m=String(d||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1]}`:String(d||"")}
async function buildProgressPdf(pkg,P){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"mm",format:"a4",orientation:"portrait",compress:true});
  const W=210,H=297,M=10,CW=W-2*M,FOOT=6,AVAIL=H-2*M-FOOT;
  const PUR=[131,47,132],GOLD=[251,185,0],LAV=[239,227,240],INK=[34,21,42],MUT=[102,87,107],LINE=[205,190,206],WHITE=[255,255,255],GREEN=[44,118,70],TRACK=[232,224,233];
  const logo=await logoForPdf();
  const base=P.meta.project?P.meta.project.split(" – ")[0]:pkg;
  const title=base+" – Mechanical Progress Report";
  const COLS=[["SOR",17,"l"],["Line item",62,"l"],["Unit",13,"l"],["Scope qty",17,"r"],["Done to date",19,"r"],["% complete",28,"pc"],["Comments",34,"l"]];
  const o=avgPct(allLines(P));
  const clean=t=>String(t==null?"":t).replace(/\r/g,"");
  function run(s,draw){
    const fs=8.2*s, lh=fs*0.3528*1.22, pad=1.35*s, row1=lh+2*pad;
    const F=(size,bold,c)=>{doc.setFont("helvetica",bold?"bold":"normal");doc.setFontSize(size);doc.setTextColor(...c)};
    const box=(x,y,w,h,fillC,stroke)=>{if(!draw)return;if(fillC){doc.setFillColor(...fillC);doc.rect(x,y,w,h,"F")}
      if(stroke){doc.setDrawColor(...LINE);doc.setLineWidth(0.15);doc.rect(x,y,w,h,"S")}};
    const txt=(t,x,y,opt)=>{if(draw)doc.text(t,x,y,Object.assign({baseline:"top",lineHeightFactor:1.22},opt||{}))};
    const wrap=(t,w,size,bold)=>{F(size,bold,INK);return doc.splitTextToSize(clean(t),Math.max(w,4))};
    let y=M;
    // brand header
    const hb=25*s, lH=hb-7*s, lW=Math.min(lH*logo.w/logo.h,60*s);
    box(M,y,CW,hb,PUR);box(M,y+hb,CW,1.3*s,GOLD);
    if(draw)doc.addImage(logo.data,logo.fmt,M+4*s,y+3.5*s,lW,lW*logo.h/logo.w);
    const tx=M+4*s+lW+7*s, tw=CW-(tx-M)-4*s;
    const tl=wrap(title,tw,13*s,true), tH=tl.length*13*s*0.3528*1.15, gH=7.6*s*0.3528;
    const top=y+(hb-(tH+1.8*s+gH))/2;
    F(13*s,true,WHITE);txt(tl,tx,top,{lineHeightFactor:1.15});
    F(7.6*s,false,[246,228,247]);txt("Enhancing Environments. Advancing Engineering.",tx,top+tH+1.8*s);
    y+=hb+1.3*s+3.5*s;
    // report details, two columns
    const half=CW/2, lw=27*s;
    const L=[["project","Project"],["contractor","Contractor"],["scope","Scope basis"]], R=[["period","Reporting period"],["reportDate","Report date"],["preparedBy","Prepared by"]];

        const h=Math.max(item.length*lh,com.length*lh*0.92,lh)+2*pad;
        let cx=M;
        const vals=[l.sor,item,l.unit,l.qty,l.done];
        COLS.forEach(([lab,w,al],ci)=>{
          box(cx,y,w,h,null,true);
          if(ci<5){F(fs,ci===0,INK);const v=vals[ci];if(al==="r")txt(String(v||""),cx+w-pad,y+pad,{align:"right"});else txt(v,cx+pad,y+pad)}
          else if(ci===5){
            if(pc==null){F(fs,false,MUT);txt("n/a",cx+w-pad,y+pad,{align:"right"})}
            else{const bw=w-2*pad-10*s, by=y+pad+lh/2-0.9*s;
              if(draw){doc.setFillColor(...TRACK);doc.rect(cx+pad,by,bw,1.8*s,"F");
                doc.setFillColor(...(pc===1?GREEN:PUR));if(pc>0)doc.rect(cx+pad,by,Math.max(bw*pc,0.4),1.8*s,"F")}
              F(fs,true,pc===1?GREEN:INK);txt(pct0(pc),cx+w-pad,y+pad,{align:"right"})}
          } else {F(fs*0.92,false,INK);txt(com,cx+pad,y+pad)}

    box(M,y,CW,oh,GOLD,true);F(fs*1.05,true,INK);txt("Overall progress (average of quantified line items)",M+pad,y+pad+0.4*s);
    txt(pct1(o.avg),M+pcX+COLS[5][1]-pad,y+pad+0.4*s,{align:"right"});
    y+=oh+3.5*s;

    const iss=wrap(P.issues||"",CW-2*pad,fs,false), ih=Math.max(iss.length*lh+2*pad,16*s);
    box(M,y,CW,ih,null,true);F(fs,false,INK);txt(P.issues?iss:"",M+pad,y+pad);
    y+=ih+3.5*s;
    // look-ahead
    bar("Look-ahead – next period");
    const lkw=52*s;
    PLOOK.forEach(([k,lab])=>{
      const v=wrap((P.look||{})[k]||"",CW-lkw-2*pad,fs,false), h=Math.max(v.length,1)*lh+2*pad+1*s;
      box(M,y,lkw,h,LAV,true);box(M+lkw,y,CW-lkw,h,null,true);
      F(fs,true,INK);txt(lab+":",M+pad,y+pad);F(fs,false,INK);txt(v,M+lkw+pad,y+pad);y+=h});

  }
  let s=1, fits=true;

  run(s,true);
  doc.setProperties({title,subject:"Mechanical progress report",author:P.meta.preparedBy||"AirconMech",creator:"AirconMech project tracker"});
  return {buf:doc.output("arraybuffer"),fits,base};
}

/* ---------- Excel import / export ---------- */
const XL={
  delay:{sheet:"Delay Log",map:{"Ref":"ref","Package":"pkg","Delay description":"title","Cause":"cause","Impact":"impact","Date identified":"identified","Responsible party":"responsible","Planned date":"original","Forecast date":"revised","Status":"status","EOT claim":"eot","Mitigation / recovery plan":"mitigation","Date closed":"closedOn","Comments":"comments"}},
  action:{sheet:"Action Tracker",map:{"Ref":"ref","Package":"pkg","Action":"title","Owner":"owner","Raised at":"source","Date raised":"raised","Due date":"due","Priority":"priority","Status":"status","Date closed":"closedOn","Update / comments":"notes"}},
  todo:{sheet:"To-Do List",map:{"Ref":"ref","Package":"pkg","Task":"title","Who":"owner","Due date":"due","Priority":"priority","Status":"status","Notes":"notes"}}
};
const DATEK=new Set(["identified","original","revised","closedOn","raised","due"]);
const p2=n=>String(n).padStart(2,"0");
function iso(v){
  if(typeof v==="number"&&v>20000){const d=new Date(Math.round((v-25569)*864e5));return d.getUTCFullYear()+"-"+p2(d.getUTCMonth()+1)+"-"+p2(d.getUTCDate())}
  if(typeof v==="string"){const s=v.trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+"-"+m[2]+"-"+m[3];
    m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);if(m){const y=m[3].length===2?"20"+m[3]:m[3];return y+"-"+p2(m[2])+"-"+p2(m[1])}}
  return "";
}
function parseProgress(ws){
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
  const T=v=>String(v==null?"":v).trim();
  const hi=rows.findIndex(r=>T(r[0])==="SOR"&&r.map(T).includes("Done to date"));if(hi<0)return null;
  const head=rows[hi].map(T), ci=n=>head.indexOf(n);
  const c={item:ci("Line item"),unit:ci("Unit"),qty:ci("Scope qty"),done:ci("Done to date"),comments:ci("Comments")};
  const P={meta:{},sections:[],issues:"",look:{planned:"",deliveries:"",tests:""}};
  const MK={"Project":"project","Contractor":"contractor","Scope basis":"scope","Reporting period":"period","Report date":"reportDate","Prepared by":"preparedBy"};
  rows.slice(0,hi).forEach(r=>{const k=MK[T(r[0])];if(k)P.meta[k]=k==="reportDate"?(iso(r[1])||T(r[1])):T(r[1])});
  let sec=null;const used=new Set();
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i],a=T(r[0]),b=T(r[c.item]);
    if(/^Overall progress|^Issues, risks/i.test(a))break;
    if(!a&&!b)continue;
    if(a&&!b){sec={name:a,lines:[]};P.sections.push(sec);continue}
    if(!sec){sec={name:"Line items",lines:[]};P.sections.push(sec)}
    let id="L"+(a||i);while(used.has(id))id+="_";used.add(id);
    sec.lines.push({id,sor:a,item:b,unit:T(r[c.unit]),qty:T(r[c.qty]),done:T(r[c.done]),comments:c.comments>=0?T(r[c.comments]):""});
  }
  const ii=rows.findIndex(r=>/^Issues, risks/i.test(T(r[0]))), li=rows.findIndex(r=>/^Look-ahead/i.test(T(r[0])));
  if(ii>=0)P.issues=rows.slice(ii+1,li>ii?li:rows.length).map(r=>r.map(T).filter(Boolean).join(" ")).filter(Boolean).join("\n");
  const LK={"Planned activity / rows:":"planned","Material deliveries due:":"deliveries","Tests and inspections planned:":"tests"};
  if(li>=0)rows.slice(li+1).forEach(r=>{const k=LK[T(r[0])];if(k)P.look[k]=r.slice(1).map(T).filter(Boolean).join(" ")});
  return P.sections.some(s=>s.lines.length)?P:null;
}
async function importXlsx(file){
  if(!window.XLSX||readOnly)return;
  let wbk;try{wbk=XLSX.read(await file.arrayBuffer(),{type:"array"})}catch(e){toast("That file could not be read. Choose an .xlsx file.");return}
  const byRef=new Map();items.forEach(i=>{if(i.ref)byRef.set(i.kind+"|"+i.ref,i)});
  let added=0,updated=0,n=0;const out=[];const base=Date.now();
  for(const kind of Object.keys(XL)){
    const ws=wbk.Sheets[XL[kind].sheet];if(!ws)continue;
    const map=XL[kind].map, titleHead=Object.keys(map)[2];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
    const hi=rows.findIndex(r=>r.map(x=>String(x).trim()).includes(titleHead));if(hi<0)continue;
    const head=rows[hi].map(x=>String(x).trim());
    for(const r of rows.slice(hi+1)){
      const o={};head.forEach((h,c)=>{if(map[h])o[map[h]]=r[c]});
      const title=String(o.title==null?"":o.title).trim(), pkg=String(o.pkg||"").trim().toUpperCase();
      if(!title||!PKGS.some(p=>p.id===pkg))continue;
      const S=SCHEMA[kind], fref=String(o.ref||"").trim();
      const ex=fref&&byRef.get(kind+"|"+fref);
      const it=ex?{...ex}:{id:newId(),kind,createdAt:base+(n++)};
      S.fields.forEach(f=>{if(f.t==="pkg")return;const v=o[f.k];it[f.k]=DATEK.has(f.k)?iso(v):String(v==null?"":v).trim()});
      const so=S.fields.find(f=>f.k==="status").o;if(!so.includes(it.status))it.status=so[0];
      it.pkg=pkg;
      it.ref=ex?ex.ref:(fref||nextRef(kind,pkg,it.id));
      if(o.closedOn)it.closedOn=iso(o.closedOn);
      if(isClosed(it)&&!it.closedOn)it.closedOn=today();
      if(!isClosed(it))delete it.closedOn;
      it.updatedAt=Date.now();
      items.set(it.id,it);byRef.set(kind+"|"+it.ref,it);out.push(it);
      ex?updated++:added++;
    }
  }
  let progDone=false;
  for(const name of wbk.SheetNames){
    if(Object.values(XL).some(x=>x.sheet===name))continue;
    const P=parseProgress(wbk.Sheets[name]);
    if(P){progress.ML=P;progDone=true;break}
  }
  if(!out.length&&!progDone){toast("No entries found. Use the tracker spreadsheet or the ML progress report.");return}
  render();
  if(progDone)saveProg("ML");
  if(mode==="db"){for(const it of out){try{await db.collection("items").doc(it.id).set(it)}catch(e){failed(e);return}}}else saveLocal();
  const msg=[];
  if(out.length)msg.push(`Imported ${added} new and updated ${updated} existing entr${added+updated===1?"y":"ies"}.`);
  if(progDone)msg.push("ML progress report imported.");
  toast(msg.join(" "));
}

if(!(window.claude&&typeof window.claude.use==="function")){
  downloads={save:async({filename,data})=>{
    const ext=(filename.match(/\.(\w+)$/)||[])[1]||"";
    const type={csv:"text/csv",pdf:"application/pdf",xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}[ext.toLowerCase()]||"application/octet-stream";
    const blob=new Blob([data],{type});
    try{const f=new File([blob],filename,{type});
      if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return{status:"saved"}}}
    catch(e){if(e&&e.name==="AbortError")throw{code:"cancelled"}}
    const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return{status:"saved"};
  }};
  if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
render();
if(!(window.claude&&typeof window.claude.use==="function"))tryRepoLogo(["logo.svg","logo.png"]);
(async()=>{
  const c=window.claude;if(!c||typeof c.use!=="function")return;
  c.use("downloads").then(d=>{downloads=d;render()}).catch(()=>{});
  let d;try{d=await c.use("db")}catch(e){d=null}
  if(!d)return;
  db=d;mode="db";
  const pending=[...items.values()];let migrated=false;
  db.collection("items").onSnapshot(snap=>{
    if(!migrated&&!snap.metadata.fromCache){
      migrated=true;
      if(snap.empty&&pending.length){
        (async()=>{for(const it of pending){try{await db.collection("items").doc(it.id).set(it)}catch(e){failed(e);return}}
          try{localStorage.removeItem(LS)}catch(e){}})();
        return;
      }
    }
    if(snap.empty&&!migrated)return;
    items=new Map();snap.docs.forEach(x=>{const v=x.data();if(v)items.set(x.id,{...v,id:x.id})});
    render();
  },()=>{mode="local";db=null;toast("Live saving stopped. Changes now save on this device.");render()});
  const pendingProg=clone(progress);let pmig=false;
  db.collection("progress").onSnapshot(snap=>{
    if(!pmig&&!snap.metadata.fromCache){
      pmig=true;
      if(snap.empty&&Object.keys(pendingProg).length){
        (async()=>{for(const k of Object.keys(pendingProg)){try{await db.doc("progress/"+k).set(pendingProg[k])}catch(e){failed(e);return}}})();
        return;
      }
    }
    if(snap.empty&&!pmig)return;
    const np={};snap.docs.forEach(x=>{const v=x.data();if(v&&v.sections)np[x.id]=v});
    progress=np;renderLanes();if(view==="progress")syncProg();
  },()=>{});
  db.doc("meta/project").onSnapshot(s=>{if(s.exists){const v=s.data()||{};if(v.name){projectName=v.name;renderName()}projectLogo=v.logo||projectLogo;renderLogo()}},()=>{});
  render();
})();
})();
</script>
